 sec_natural_resource_developer:0 "Natural resource developer"
 WCC_George_Wallace_hog_ade:0 "George Wallace"
 hog_hardline_segregationist:0 "A hardline advocate of apartheid"
 WCC_liquidating_the_Bourgeosie:0 "Exterminate the Traitorous Bourgeoisie"
 WCC_public_infrastructure:0 "Work-Relief Programs for Infrastructure"
 WCC_public_infrastructure_desc:0 "To quickly build the nation's infrastructure, and to ease the scourge of mass unemployment, the president has announced a new work relief program. Funded by the state through tax dollars and employing the unemployed in a series of public works projects designed to build highways, subways, ferry lines, and other transit facilities and connect city ministries, this new program will modernize America's arteries while also breathing new life into our ailing economy."
 WCC_america_last_hope:0 "American Last Hope"
 WCC_partial_suppression:0 "Syndicalist Union Suppression"
 WCC_partial_suppression_desc:0 "We have decided to suppress the traitorous unions that aligned themselves with the CSA. This will rid us of the most dangerous unions while also allowing us to hold up their patriotic counterparts as examples."
 WCC_full_suppression:0 "Union Suppression"
 WCC_full_suppression_desc:0 "We have decided to suppress all unions in the aftermath of the Civil War. This is a controversial decision, but we cannot allow what happened with the Combined Syndicates to happen again. We will take no chances!"
#国策
 WCC_reunify:0 "Rebirth of the American Spirit"
 WCC_reunify_desc:0 "The tragic Second Civil War in United States has finally ended, the insurgents and separatist forces have been completely eliminated, and MacArthur, the dictator, has been wiped out. The Western Military District, led by General Omar Bradley, won the final victory. Soon, three generals, Omar Bradley, Dwight D Eisenhower, and Curtis Lemay, will decide the future of America."
 WCC_American_Pompey:0 "American Pompey"
 WCC_American_Pompey_desc:0 "Bradley defeated not only the populists, syndicalism thugs, and nationalist scum, but also MacArthur, a tyrant intent on destroying the foundations of American democracy. As a loyal believer in American democracy, but also as the true savior of the Republic, he needs to better organize and expand his government, since he now commands the entire United States. However, General Bradley is not as ambitious as MacArthur, and in a recent public speech, he stated that "elections will be resumed under conditions of political and economic stability", and the community has great expectations and trust in the general. People believed that under his leadership, America would soon return to the top of the world."
 WCC_End_tyrant:0 "End Tyrant"
 WCC_End_tyrant_desc:0 "Douglas MacArthur and his men probably inflicted more damage on the country in the Civil War than any other faction. Other factions may be extremists, but they are fighting for what they believe is right, not a naked power grab like MacArthur's. In order to ensure that no careerist will follow in MacArthur's footsteps for his own selfish ends in the future, we must completely overthrow MacArthur in both reality and propaganda, but also overthrow the dictatorship and despotism he represents."
 WCC_salute_comrades:0 "Honor the Comrades"
 WCC_salute_comrades_desc:0 "Countless American men have died on the front lines to bring peace and order back to the United States, and those who are wounded must live with the price they have paid for the rest of their lives. Now, to appease these heroes, we will erect monuments, set a day of remembrance, and pay handsome pensions so that the heroes and their families can live a good life."
 WCC_lead_heroes_to_their_home:0 "New Home for Heros"
 WCC_lead_heroes_to_their_home_desc:0 "For the United States today, the massive expansion of the army for the civil War has become bloated and useless, which greatly affects the speed and efficiency of our reconstruction. To address today's conundrum, General Bradley's advisers will be working as fast as they can to devise a rough demobilisation plan that will allow the overstretched army and militia to be cut down smoothly and quickly. It is time for our heroes to retire from the military and redouble their efforts to rebuild today's society with their honor."
 WCC_Remember_Declaration_of_Independence:0 "Remember Declaration of Independence"
 WCC_Remember_Declaration_of_Independence_desc:0 "When our great founding father, Thomas Jefferson, wrote the Declaration of Independence on the second floor of a small building in Philadelphia, it was a document detailing the meaning and purpose of America that forever embodied the spirit of freedom and democracy. The declaration represents the moral standard to which the United States should strive, and sets the course that American politics must follow, namely, that all desires and ambitions must give way once and for all to unshakable democracy and republicanism. Now, we will reaffirm this unshakable fact and activate the state propaganda machine to impress upon all the people."
 WCC_Fixing_Congress:0 "Fixing Congress"
 WCC_Fixing_Congress_desc:0 "In the bitter Civil War, the Congress representing the American democracy suffered the fierce destruction of the war, both in the physical sense and in the political sense. The urgent task now is to repair the political apparatus in Washington, D.C., including Capitol Hill, as soon as possible, and to activate the propaganda machine to re-establish a democratic and republican consensus in society."
 WCC_model_new_law:0 "Model New Law"
 WCC_model_new_law_desc:0 "Past constitutions have shown various flaws that allowed incompetent politicians and insidious radical careerists to enter American politics and lead to the civil war that tore the country apart. In order to solve this problem once and for all, General Bradley has assembled all the think tanks and jurisprudence, and even several historians, to revise the current Constitution so that it can stabilize American politics and keep it on course."
 WCC_Bridging_North_South_divide:0 "Bridging North-South Divide"
 WCC_Bridging_North_South_divide_desc:0 "In history, the Civil War did not completely suppress the separatist forces in the South, nor did it completely erase the racists and radicals in the South, which led to the independence of the South in the Civil War. It is time to put an end to all this, to resolve once and for all the conflicts that have long existed between North and South, and to heal this torn nation. Soon the old Democratic political machinery in the South will be uprooted, and extremist groups such as the kkk will be completely crushed."
 WCC_defend_american_military_spirit:0 "Defend American Military Spirit"
 WCC_defend_american_military_spirit_desc:0 "The Yankee spirit of America has been imbued with a military spirit since our founding, and it is that spirit that helped us succeed in the Civil War. Now the cruelty and carnage of the Civil War has made the vast majority of American citizens have lost this spirit and blood. But in our propaganda and speeches, this decline will be quickly reversed."
 WCC_Perfectly_functioning_democratic_government:0 "Perfectly Functioning Democratic Government"
 WCC_Perfectly_functioning_democratic_government_desc:0 "After a series of political reforms and economic reconstruction, American society has been able to barely return to pre-war levels. At the same time, there is a growing chorus of voices calling for the government to return to elections, including many politicians who were prominent before the Civil War. President Bradley agreed that with the political environment recovering, it was time to put the first post-Civil War democratic elections on the agenda. However, in order to make sure that democracy does not go off course again, General Bradley will be a patriot to draw the political red line, to ensure that the new democratic government can work perfectly."
 WCC_Fairness_morality_progress:0 "Rich and Prosperous Society"
 WCC_Fairness_morality_progress_desc:0 "Today, the worst of reconstruction is over, and the lives of American citizens are getting back on track. It is time for a series of welfare programs and poor laws to guarantee the American Dream. General Bradley would issue a series of executive orders allocating vast sums of money for the relief of citizens still reeling from the depths of the Civil War, and a massive start to public works would greatly reduce unemployment."
 WCC_Make_founding_Fathers_proud:0 "Make Founding Fathers Proud"
 WCC_Make_founding_Fathers_proud_desc:0 "There can be no doubt that Omar Bradley has fulfilled his promise to all American citizens, and has done so with pride and dignity. Now that democratic elections have returned to the land that so many men fought for 200 years ago, General Bradley can proudly claim that he has not disgraced the founding Fathers."
 WCC_Eisenhower:0 "Sulla for the New Era"
 WCC_Eisenhower_desc:0 "Like his friend Bradley, Dwight D. Eisenhower fought for democracy and the republic. But unlike Bradley, Eisenhower saw the flaws and vulnerabilities of democratic politics after witnessing the chaos of the pre-Civil War elections. Now Eisenhower was officially leading the nation. Under his guidance, the dream of American democracy would not be tarnished by the hand of a tyrant, and the stability and efficiency of realpolitik would be brought back to American politics by Eisenhower once and for all."
 WCC_new_American_dream:0 "New American Dream"
 WCC_new_American_dream_desc:0 "Now, under the leadership of President Eisenhower, the United States had fully recovered from the dark cloud of civil war. Smiles began to appear on people's faces, and the wonderful prosperity that had existed before the Great Depression seemed to be reappearing on American soil. People began to look forward to the future, began to dare to dream, gradually became full of confidence in the future. Now, the American dream has begun to be widely talked about again, and today's beautiful society has become the beginning of a new American dream."
 WCC_Go_into_space:0 "Reach New Heights"
 WCC_Go_into_space_desc:0 "President Eisenhower had always been interested in a national defense strategy to build an atmospheric defense system, and the proposal was now nothing more than a bubble in the strategic and tactical landscape. President Eisenhower told his Cabinet that it was time to turn the nation's focus to the idea. Once the United States makes a huge breakthrough in this field, it will completely establish the unquestionable supremacy of the United States in the sky, and it will prove the unparalleled superiority of the American democratic system. Now, it's time to reach new heights!"
 WCC_Large_military_order:0 "Large Military Order"
 WCC_Large_military_order_desc:0 "With the demobilization of the United States Army, once-large arms orders declined to an alarming extent during reconstruction. However, with the end of reconstruction and the beginning of the expansion of the United States Army, the number of arms orders increased. Shipments of rifles, artillery pieces and trucks were removed from warehouses and transferred to different military bases across the United States. Now that the United States is recovering, these big military orders are the best stimulant."
 WCC_progressive_conservative_party:0 "Progressive Conservatism Leads Us"
 WCC_progressive_conservative_party_desc:0 "President Eisenhower emphasized his conservative position in almost every press conference, but he never forgot to present his progressive ideals to the public. He describes himself as a "progressive conservative" and uses terms like "progressive moderate" and "dynamic conservatism" to describe his approach. The president understands what progressivism means to the people of this country. As he told his colleagues, "Knights with the shield of conservatism wield the sword of progress and freedom to build the American dream.""
 WCC_I_LIKE_IKE:0 ""I LIKE IKE""
 WCC_I_LIKE_IKE_desc:0 "The Patriot Party is now the undisputed largest political party in the United States, after a political process that has divided, crushed and absorbed rival parties, and with the expansion of our political machinery and the success of the president's approach to government, from the financial tycoons of Wall Street to the rural farmers of rural America, All believed in their hearts that President Eisenhower could lead America to a brighter future. The simple phrase "I Like Ike", which was used as Eisenhower's campaign slogan, has become a well-known fact on the streets of America."
 WCC_Ikes_political_machine:0 "Eisenhower's Political Machine"
 WCC_Ikes_political_machine_desc:0 "Far from being a dictator, Eisenhower saw democratic elections as an integral part of the American political system. But at the same time, the president, who had lived through the civil war, could not trust the old party system enough. As a result, the political machine of the Patriot Party will be unrivalled under his presidency. Only by completely weakening the Republican and Democratic parties and the rest of the minor parties, and securing enough of his own hardcore supporters, could Eisenhower fully realize his political ideals without destroying the democratic structure, and bring about a real revival of the United States."
 WCC_New_cabinet:0 "Eight Millionaires and A Soldier"
 WCC_New_cabinet_desc:0 "In choosing his cabinet, the President chose not former military colleagues, but financial tycoons and elites such as John Foster Dulles or Joseph M. Dodge. When the final cabinet was finalized, people were surprised to find that the list was almost entirely filled with experienced managers or bureaucrats. Reporters called them "eight millionaires and one soldier," and Eisenhower believed that only these efficient and ruthless elites could better shape the future of American policy."
 WCC_Strengthen_presidency:0 "Empowering the White House"
 WCC_Strengthen_presidency_desc:0 "The first act of the Eisenhower administration was to strengthen the power of the White House office in American politics. In the president's latest document, the power of Congress and the Supreme Court has been greatly reduced, and the political power and status of the president has reached a level never before in history. Although President Eisenhower stated in a public conference that the move was "to better unify the executive power of the country and rebuild America with the greatest efficiency," some judges, senators, and politicians expressed strong dissatisfaction with it."
 WCC_give_power_to_military_industrial_complex:0 "Untying the Military Industrial Complex"
 WCC_give_power_to_military_industrial_complex_desc:0 "Although the smoke of the New World had cleared, the whole world order continued to crumble. The president and his colleagues are acutely aware that the world's wars are unlikely to end any time soon. That's why the President has issued an executive order to begin the process of reorganizing the loyal businesses that helped us win the Civil War. Once scattered industrial plants and manufacturing workshops will be integrated, and the iron chain tied to the military enterprises will be completely disconnected. These loyal military industries will, under the direction of the President, provide the good men of the United States armed forces with a continuous supply of munitions."
 WCC_LeMay:0 "Caeser's Heir"
 WCC_LeMay_desc:0 "Although MacArthur has been reviled as a tyrant and the old Caesar is now reviled, Curtis Lemay believes that only an evolving, belligerent and powerful nation, united under a strong leader, can stand at the pinnacle of world civilization. MacArthur's only mistake was to pursue too much power and be persecuted by the masses, and Lemay will not repeat MacArthur's mistake. Guided by pure patriotism and pride as a combative warrior, Curtis Lemay will hold a divided America together and stand with every citizen to achieve American hegemony in the world."
 WCC_Unite_MacArthur_faction:0 "Unite MacArthurites"
 WCC_Unite_MacArthur_faction_desc:0 "Although MacArthur was a power-hungry bastard, his methods and practices did not deviate far from President Lemay's ideas. On the contrary, some MacArthur loyalists began to re-engage with President Lemay, while the rest of the die-hards were already in prison or labor camps. MacArthur's supporters included some senior military officers and political magnates whose support could only help our government."
 WCC_power_of_lemay:0 ""Big Cigar"'s Iron Fist"
 WCC_power_of_lemay_desc:0 "Although General Lemay had legitimately taken over the nascent American government, the political factions in the United States did not really obey him. Whether it is the politicians who sabotage Lemay openly or the conspirators who subvert Lemay secretly, "Big Cigar" never sees these clowns as a threat. Soon, the investigation and arrest of all dissenters and plotters will begin with lightning speed, and they will be completely crushed. Only in this way can all the losers who are dissatisfied with the Lemay regime realize that the iron fist of "Big cigar" is never a joke."
 WCC_Global_intervention:0 "Global Intervention"
 WCC_Global_intervention_desc:0 "Peace in America cannot depend on complacency, nor can it depend on the two oceans.   The experience and lessons of the past have taught us unequivocally that the Monroe Doctrine and neutralism are a total error, a false policy capable of destroying the future of the United States. American foreign policy today will actively engage in foreign affairs around the world and ensure that we are involved in any armed conflict. America's peaceful and secure external environment can only be ensured by extending our power and influence around the world. Peace does not depend on an agreement, but on planes and tanks."
 WCC_olive_branch_of_the_South:0 "Olive Branch from the South"
 WCC_olive_branch_of_the_South_desc:0 "The Old Democrats and extremists of the Ku Klux Klan in the South during the Civil War deserve to be put on a pedestal of shame, but only for their treason. General Lemay himself was not overly prejudiced against the Dixie. Recently, some members of the staff proposed to declare amnesty for some Southern Democrats and kkk, which would not only unite greater political forces, but also stabilize the South at the fastest speed."
 WCC_Foment_Red_panic:0 "Foment Red Panic"
 WCC_Foment_Red_panic_desc:0 "Despite the failure of the Combined Syndicates as the good dogs of the Third International, the red cancer and curse they planted are still poisoning American society. Curtis Lemay will not tolerate any more of this. He would, on the advice of a Southern senator, McCarthy, launch a nationwide screening campaign for red molecules to eliminate the red virus from the United States."
 WCC_Absolute_air_supremacy:0 "Good Boys in the Air Force"
 WCC_Absolute_air_supremacy_desc:0 "In the civil war, the air fighters of our air Corps did everything they could to fight the damn rebels in the skies. Now it's time for them to be rewarded. President Lemay will allocate budget for the development and upgrading of new equipment in the Air Force, and use the propaganda machine to celebrate the air Force pilots in society. Soon, the worship of the air force will be popular in the society, and can better strengthen our national defense force."
 WCC_Strongman_politics:0 "Strongman Politics"
 WCC_Strongman_politics_desc:0 "The past weakness of the Hoover administration made Lemay realize the limitations and ineptitude of these politicians. But now Lemay will promote elites from all walks of life into the government, not to let them dominate the government, but as the president's aides or aides to help run the government. President Lemay will ensure that all the powerful institutions are in his hands so that the United States does not stray off course."
 WCC_Simple_but_strong_patriotism:0 "Simple but Strong Patriotism"
 WCC_Simple_but_strong_patriotism_desc:0 "In the midst of a civil war, our troops and territories were filled with loyal, patriotic citizens, heroes who sacrificed to make us a free nation. We will celebrate and promote this simple patriotism, and encourage today's Americans to share this powerful patriotism with their children and grandchildren, and use it to help build a better America."
 WCC_American_military_political_system:0 "American Military Political System"
 WCC_American_military_political_system_desc:0 "Democracy has proven its ineptitude in the past, and weak politicians can no longer harm American soil today. Curtis Lemay will establish a new military political system of loyal service to the United States from top to bottom, and completely rid the United States of all hostile elements and divisive forces."
#麦克阿瑟
 WCC_mac_shall_return:0 "I Shall Return"
 WCC_mac_shall_return_desc:0 "MacArthur has come to us beaten and bloodied. But, he is not broken. In fact, his resolve has never been stronger. Despite that, he has come to us a changed man. Wildly decrying revolutionaries and reactionaries, he speaks of our American identity, rallying our people to massacre those who have betrayed our country. Though we don't have much, we will use what we have to beat the traitors once and for all.
 WCC_conscript:0 "Conscription"
 WCC_conscript_desc:0 "MacArthur had realized that the defeat in the East was not the result of bad judgment or strategic error on the part of the Army command, but of his inability to raise enough troops to meet the rebel attack from both directions. Now, when he arrived in the West, his first orders were to increase conscription and increase the age of service. In his view, only by giving priority to ensuring that there are enough tactical reserves at hand can the rebel offensive be completely suppressed tactically and even strategically."
 WCC_CIA:0 "Central Intelligence Agency"
 WCC_CIA_desc:0 "Ever since MacArthur arrived in the Western Command Center, it had become clear to all that he had become a very paranoid man. But given the state of our country, he has good reason to be paranoid. He called for the creation of a new U.S. security force, specialized in special operations, to carry out any mission he saw fit to bring order back to the United States. Some whispered that MacArthur wanted to create a secret police force, but those who opposed it were quickly "silenced." Now, the agents of the newly formed CIA took direct orders from MacArthur himself and served him faithfully."
 WCC_Infiltration_operation:0 "Infiltration Operation"
 WCC_Infiltration_operation_desc:0 "In the vast western mountains, ordinary tactics are difficult to implement effectively. The rugged mountains are also different from the flat eastern and central plains, and mobile troops are difficult to deploy. MacArthur and his generals therefore developed infiltration tactics suitable for the West, and achieved good results in skirmishes with the rebels at the front. Our elite troops crossed the mountains and hills to the enemy's rear and attacked their supply lines and headquarters, breaking their chain of command. Soon, this grass-roots tactic will be fully applied to every front."
 WCC_all_are_soldiers:0 "Join the Army and Serve the Country"
 WCC_all_are_soldiers_desc:0 "At present, the Western Military region is still in the situation of manpower shortage. We must further fire up our propaganda machine to attract more young men and women into our armed forces to defend America. And for those who maliciously evade the draft, we have another response to make these rebellious young people obey our orders."
 WCC_Military_intelligence:0 "Military Intelligence"
 WCC_Military_intelligence_desc:0 "At MacArthur's request, we set up an independent intelligence staff to help us manage military affairs and work with the CIA to decipher more enemy intelligence for us. It will be used as an intelligence agency and a tool to help us wage aggressive war against our enemies. We will no longer be outgunned - we will take the fight to our enemies!"
 WCC_Promote_officers:0 "Promote Officers"
 WCC_Promote_officers_desc:0 "Throughout the United States, not all soldiers are traitors or enemies. The loyal soldiers of the Western Military District did their duty and loyalty well to the United States and to MacArthur himself. And now MacArthur is going to give them the reward they deserve. Of course, capable officers and enlisted men will receive the promotions they deserve to ensure the effectiveness of our military."
 WCC_Military_first_policy:0 "Military First Policy"
 WCC_Military_first_policy_desc:0 "Now that the Western Military District has come to the most difficult juncture, naturally we cannot be as kind as in the past. If we do not devote every available resource to our military, the front will soon be torn apart by insurgents, and the flame of the Union that we have so painstakingly preserved will be destroyed. Only by firmly carrying out the policy of putting the military first can we get through this difficult time."
 WCC_Alliance_of_interests:0 "Alliance of Interests"
 WCC_Alliance_of_interests_desc:0 "General MacArthur had sent a telegram to the watching Mexicans in the south, stating that the United States would give Mexico a political and economic green light after the war if the Mexican government would help the Western military District. Of course, today's agreement is hardly less than a scrap of paper after the war......"
 WCC_Mobile_force:0 "Mobile Force"
 WCC_Mobile_force_desc:0 "Speed, only speed can ensure that our attack will not meet the fierce resistance of the enemy. We must equip all front-line troops with enough fast-moving equipment as far as possible, so that they can quickly penetrate the enemy's lines in battle and surround them to achieve the purpose of annihilation."
 WCC_Praise_patriots:0 "Praise Patriots"
 WCC_Praise_patriots_desc:0 "It is hard not to feel pessimistic about the current state of the Western Army. But the more dark these times are, the less we should let go of those good qualities, like our unparalleled patriotism. We will honor and celebrate these patriots who are still fighting so that all of America and the world can see our resolve."
 WCC_All_for_front:0 "All for Front"
 WCC_All_for_front_desc:0 "Now, our soldiers on the front lines continue to report frequent shortages of supplies and supplies. However, the expropriation of major capitalists or local residents has been going on for a long time. Now it is up to them to make greater sacrifices and contributions to our front line."
 WCC_Come_back_from_failure:0 "Come Back from Failure"
 WCC_Come_back_from_failure_desc:0 "Although the present situation is not ideal, and the western region has been mobilized to the limit, our will has not been broken, and our counterattack will continue. MacArthur would not concede; he would not bow to the insurgents. He had already failed once, and if he failed a second time, he would keep fighting until he had saved America from the flames of civil war."
 WCC_incredible_victory:0 "Incredible Victory"
 WCC_incredible_victory_desc:0 "Although MacArthur suffered serious defeats in the East, these setbacks did not bring down the unyielding leader. After the strategic shift and a series of hard efforts and struggles, Douglas MacArthur truly achieved the miracle of human military history and even history, and successfully pacified the whole country. Now that the dust has settled, it is time to begin reckoning and rebuilding."
 WCC_watchman:0 "The Watchmen"
 WCC_watchman_desc:0 "Huey Long, the populist leader of the South, despite his lies, had a loyal militia, and MacArthur was betrayed even by his own comrades in the Civil War. Having learned this lesson the hard way, President MacArthur had become increasingly distrustful of the Department of Defense and of the military. He will now set out to build up the "Watchmen", a group of militia fighters who have been answering directly to him, and rely on these loyal fighters to maintain his firm rule across the country."
 WCC_Media_control:0 "Media Control"
 WCC_Media_control_desc:0 "In the United States today, there are still many opponents of MacArthur, these clowns who use every means at their disposal to discredit our president. Although MacArthur himself did not react much to this, in order to stabilize the entire American society and prevent the infiltration of foreign elements, Congress has recently passed a speech restriction order and arrested a large number of agitators in a short period of time."
 WCC_Special_court:0 "No Mercy for Traitors"
 WCC_Special_court_desc:0 "When Washington fell, MacArthur nearly lost his life. The traitors did not show any mercy. Now that he had finally won the war, he felt a deep bitterness for a country he saw as full of traitors. The first step in rebuilding will be to bring all these traitors to trial and decide their fate."
 WCC_tax_collection:0 "Door-to-Door Tax Collection"
 WCC_tax_collection_desc:0 "MacArthur suffered hardship and hardship on his journey west, and these cowardly barons not only shirked their responsibilities in the Civil War, but even betrayed MacArthur. Now MacArthur will completely squeeze and liquidate these big, hateful bourgeoisie to make them pay back all the "taxes" due during the Civil War."
 WCC_Military_education_for_children:0 "Children Military Education"
 WCC_Military_education_for_children_desc:0 "The Boy Scouts are a wonderful organization, but we need to raise young people who are ready to go to war and defend their country. To this end, we will create the "Little Cavalry" program, which will be followed by a large number of military education programs for children. Children who participate in the program receive some training from an early age and go on to serve in the military as adults. This will provide us with much-needed manpower to replace the population we lost in the civil war and make our people more patriotic."
 WCC_Status_of_states_rights:0 "Status of States Rights"
 WCC_Status_of_states_rights_desc:0 "In the civil war, governors everywhere were tempted to throw themselves into the arms of the rebels, which was intolerable. Soon, MacArthur would really decide the fate of these governors, and even the future of the state's executive ranks. He had to make sure that in the future, the local administrative units were entirely subject to direct orders from Washington D.C. ."
 WCC_Supervised_civic_life:0 "Supervised Civic Life"
 WCC_Supervised_civic_life_desc:0 "The Civil War was over, but still a large number of defeated rebels escaped our justice and mingled with citizens throughout the United States.   So, to put an end to any operation by these dangerous individuals who would endanger our security, President MacArthur is issuing an executive order to increase oversight throughout the United States. From now on, militia groups and CIA agents will permanently monitor every citizen to protect them from the conspirators."
 WCC_Stir_up_nationalism:0 "Stir Up Nationalism"
 WCC_Stir_up_nationalism_desc:0 "During the Civil War, MacArthur saw the malign interference of foreign powers in the United States.  In his view, whether it was Rust-belt trade union rebels or Canadian puppet New England, the United States was divided by foreign interference.  Therefore, in today's propaganda machine, MacArthur has especially increased the smearing and vilification of foreign countries.  He wanted all Americans to know that only a proud America could stand on top of the world, and that the rest of the world was always determined to topple America, the beacon of the new world.  Soon, the winds of American nationalism will sweep across the country."
 WCC_Preferential_treatment_for_veterans:0 "Old Soldiers Never Die"
 WCC_Preferential_treatment_for_veterans_desc:0 "In a recent public address, President MacArthur famously said to the nation, "Old soldiers never die, they just fade away." Today, the United States has experienced a massive civil War, and countless disabled wounded and veterans are suffering from illness or hunger for various reasons. Part of the reason these national heroes are faring so badly is their lack of opportunity, but also the state's lack of interest in them. These men worked harder than anyone else to save the country from the radicals during the civil war, and they should be rewarded accordingly. We will implement a generous pension plan for all federal veterans that both encourages future military recruitment and takes care of our current veterans."
 WCC_Ban_political_parties:0 "Ban Political Parties"
 WCC_Ban_political_parties_desc:0 "Political parties are the bane of this country. George Washington knew how dangerous they could be, and so did Douglas MacArthur. We have to deal with these worms, and the best way to do that is to abolish political parties altogether. We will no longer have politicians loyal to their parties; We will only have leaders who are loyal to their country, once and for all!"
 WCC_American_emperor:0 "Not Caesar, but Augustus"
 WCC_American_emperor_desc:0 "In the past, much of the American public and media referred to MacArthur as "America's Caesar" and doubted his threat to American democracy. But MacArthur's actions during the Civil War made it clear that democracy was nothing more than a cancer on America. Now, as MacArthur's political power has expanded, he has officially abandoned the title of "Caesar." With no senatorial rats to interfere with his every move, the whole of America would now be loyal to "Augustus of America" MacArthur from top to bottom."
#重建
 WCC_together_for_victory:0 "Together for Victory"
 WCC_together_for_victory_desc:0 "Now that the civil war is over, arms have been laid down across the country. It is time to celebrate with our comrades in arms and with the people who put their hopes in us."
 WCC_Martial_law:0 "Martial Law"
 WCC_Martial_law_desc:0 "The horrors of civil war have torn our country apart, and civil violence has not ended with the armistice. In order to stabilize the current emergency, we must declare martial law to ensure that we can safely survive the most difficult period of reconstruction."
 WCC_root_out_traitors:0 "Root Out Traitors"
 WCC_root_out_traitors_desc:0 "The Syndicalist rebels, the populist demagogues, the nationalist maniacs of the South, without whom the Civil War would never have happened. Despite their complete defeat on the battlefield, the embers of these extremist forces have not dissipated. The time has come to mobilize all our present forces to thoroughly wipe out these elements of social unrest."
 WCC_military_industrial_complex:0 "Work Work and Reuild!"
 WCC_military_industrial_complex_desc:0 "We now have before us an America in ruins, an America in ruins. All our proud citizens should know that America's pain and blood will never be healed until the American people come together and work together to build their own country. It's time to put everything aside and focus on rebuilding our beautiful home."
 WCC_Amendment_to_the_Sedition_Act:0 "Sedition Act Amendment"
 WCC_Amendment_to_the_Sedition_Act_desc:0 "One of the most important acts of the early American Republic was the Aliens and Sedition Act passed by President John Adams, a wise statesman. We must restart the bill to protect real United States from separatists. First, people who pose a threat to public safety or the integrity of the nation can now be imprisoned or deported. Furthermore, anyone who may pose any threat to the national security of the United States will be dealt with the most severe punishment."
 WCC_fate_of_traitorous_enterprise:0 "The Fate of Traitorous Enterprise"
 WCC_fate_of_traitorous_enterprise_desc:0 "In the civil war, the vast majority of the arms companies betrayed us and turned to support the rebellious separatists. It is time for Congress to hear the testimony of the rebellious companies. Some are advocating for just their executives to resign, while others insist on piercing the corporate veil. This would allow the government to prosecute individual shareholders as responsible for decisions made. One way or another, we're gonna make these cowardly little people pay."
 WCC_Grand_ourt_martial:0 "Grand Martial Trial"
 WCC_Grand_ourt_martial_desc:0 "In the civil war, the men who fought side by side were divided by different ideologies and ideals. Although some of them did not commit much crime, they were still traitors to the American cause. We will give these renegade soldiers a fair and just trial in a court of law, so that those who have done wrong will be punished and the wicked will pay."
 WCC_Rural_revitalization_law:0 "Rural Revitalization Law"
 WCC_Rural_revitalization_law_desc:0 "In the Civil War, our country's once-proud agricultural industry was almost burned down, and the fierce fighting spread to almost every farm in the country. To get our agriculture back up and running as quickly as possible, a substantial budget and appropriations are needed, and Congress will act urgently to further help our farmers rebuild their industries."
 WCC_Bring_back_the_Good_road_campaign:0 "Bring Back the Good Road Campaign"
 WCC_Bring_back_the_Good_road_campaign_desc:0 "The country's infrastructure and transportation networks were devastated by the civil war, with urban roads riddled with potholes and rural roads difficult to navigate. The president has issued executive orders to begin renovating and building infrastructure across the country, including roads, highways and train routes. The Great Reconstruction is supposed to be a repeat of the Good Road Campaign of the late 19th century, and this time the Good Road Movement will not disappoint."
 WCC_Coffee_chocolate_icecream:0 "Bring Food and Joy to the People"
 WCC_Coffee_chocolate_icecream_desc:0 "During the civil war, people suffered from the consequences of deprivation, and now we must ensure that citizens have a minimum of food and clothing, and then gradually improve their quality of life.  During the Civil war, the logistics department developed a large number of army food, and much of it could be improved and used as supplies for the poor.  The civil war has made the people miserable, at least now we have to bring them happiness."
 WCC_Demobilize_army_and_build_motherland:0 "Demobilize the Army and Build the Country"
 WCC_Demobilize_army_and_build_motherland_desc:0 "In the Civil War, we recruited large numbers of young and even middle-aged men into the army. Now, in the face of reconstruction, we can no longer afford to spend useless wealth to maintain such a large army. It is time to step up disarmament and demobilize these soldiers so that they can be engaged as quickly as possible in our vigorous reconstruction campaign."
 WCC_Public_employment:0 "Expand Public Employment Programs"
 WCC_Public_employment_desc:0 "During the Great Depression, public employment programs, as one of the effective means of relieving the poor, effectively alleviated the severe unemployment phenomenon. Today, there are also a large number of people who have lost their jobs or are unable to work and cannot support themselves and their families. It is time to revive and expand public employment programs so that those who have suffered the consequences of civil war can feed themselves with their own hands."
 WCC_Civic_education:0 "Civic Cducation"
 WCC_Civic_education_desc:0 "In the Civil War, American education suffered a devastating blow. Countless institutions of higher learning have been destroyed in the war, and a large number of orphans and out-of-school children now fill our society. At the same time, many veterans have become social instability due to lack of education. We will increase funding for educational institutions across the country, and commit a significant portion of our budget to rebuilding our schools. The American Dream will come true, but the American dream does not belong to illiteracy."
 WCC_Wall_Street_tycoons:0 "Wall Street Tycoons's Fate"
 WCC_Wall_Street_tycoons_desc:0 "During the Civil War, the damn financiers on Wall Street sat back and watched our plight. These cowardly clowns, clinging to their money for fear of death, have either fled the United States or joined our enemies. Now it's time to put them on trial. If they repent, the punishment may be limited to a hefty fine or imprisonment; But if these idiots still don't understand the situation, then the iron fist from us will wake them up."
 WCC_Better_days_will_come_again:0 "Better Days Will Come Again"
 WCC_Better_days_will_come_again_desc:0 "As reconstruction came to an end, American society had returned to its pre-Civil War status. People's faces began to smile, and people in the street began to greet each other. The gloom of civil war has gradually dissipated throughout society. The bitter battles are history, and a better life awaits the American people in the future."
#陆军
WCC_grand_reorganization:0 "Grand Reorganization"
WCC_grand_reorganization_desc:0 "We have to hurry. MacArthur has given us jurisdiction over the Western reaches of our country. We need to hold this area, not just to help MacArthur, but to save our country. Now that we are surrounded on two sides, we should quickly reorganize our resources and troops to prepare for a two-front war. This will not be easy men, but we fight a good fight."
WCC_scrap_what_we_can:0 "Scrap What We Can"
WCC_scrap_what_we_can_desc:0 "We don't have much in our barren lands. But, what can we find? An armaments factory here, a private airplane there. We should scrap together, and convert, everything we possibly can. Let nothing be spared in this war effort."
WCC_fortify_the_rockies:0 "Fortify the Rockies"
WCC_fortify_the_rockies_desc:0 "We are blessed with a significant geographical advantage: the Rockies. These mountains will shield us from our foes in the West or East, depending on which side we focus on first, and will bide us crucial time. Further, there is the possibility we could bleed our more numerous foes fighting over these mountains..."
WCC_protect_the_skies:0 "Protect the Blue Skies"
WCC_protect_the_skies_desc:0 "The sky on the plain is vast, open, and blue as far as the eye can see. We should never have it blocked out by enemy aircraft. If we want to avoid that, we need to invest in anti-air equipment and technology, so that we can shoot any enemy out of the sky. The sky is blue now, and it will remain that way."
WCC_build_what_we_can:0 "Build What We Can"
WCC_build_what_we_can_desc:0 "We can scrap together everything in this great land and we still wouldn't have enough. We should also try to build new equipment and factories, so that we can stand a chance against our better equipped enemies. This will require hard work on the part of our men and women, but we have no doubt that they will rise to the task."
WCC_native_appeals:0 "Native Appeals"
WCC_native_appeals_desc:0 "It has come to this. Yes, we have to reach out to Mormons if we want to win the war. No, we are not converting to Mormonism. But, they are a significant part of our population, and we should treat them as such. Let us appeal to this group and make sure they are just as committed to our war effort as anyone else."
WCC_civilian_relocation:0 "Civilian Relocation"
WCC_civilian_relocation_desc:0 "As a military state, we must relocate civilians away from our hubs and our border cities. This will hopefully spare them from the worst of the carnage and allow us greater flexibility in our actions."
WCC_entente_aid:0 "Entente Aid"
WCC_entente_aid_desc:0 "We need more help in this war. Canada has promised us certain aid should we need it, though we did not take their offer seriously at the time. Now we have no other choice. Let us reach out to Canada and see what they can give us. With their help, we may just win this war."
WCC_to_the_last_man:0 "To the Last Man"
WCC_to_the_last_man_desc:0 "If we want to win this war, we can't afford to let the enemy outnumber and outfight us. We will fight to the last man, or we may as well not fight at all. Rally to the flag men, and tomorrow, we shall retake our country!"
WCC_washingtonian_tactics:0 "Washingtonian Tactics"
WCC_washingtonian_tactics_desc:0 "As a relatively small force next to our enemies we have much to learn from Washingtonian tactics during the Revolutionary War. Appeals to his hit-and-run tactics alongside using disinformation is not only practical but inspiring to our mens morale."
WCC_counter_propaganda:0 "Counter-Propaganda"
WCC_counter_propaganda_desc:0 "With our opponents being so ideological in nature, we need to counter their ideological tactics with our own. Counter-Propaganda will focus on debunking their claims while reminding citizens of their duty to America, the legitimate government and military, and aim to go beyond our borders into enemy territory to weaken their stance while strengthening our own."
WCC_the_colorado:0 "Our Friend, The Colorado"
WCC_the_colorado_desc:0 "We must to use the natural defenses of our region to our advantage which, combined with our superior training, will create an insurmountable barrier for our enemies to overcome while allowing them to lose their edge in manpower and for our forces to move more quickly amongst each other."
WCC_recruit_as_we_go:0 "Recruiting As We Go"
WCC_recruit_as_we_go_desc:0 "As we expand into enemy territory which, in reality, is our American territory, we need to recruit locals into our army as professional soldiers, not militias. This will allow us build from our originally sparse territory and create a wave that will retake the whole nation."
WCC_vegas_revenue:0 "Vegas Revenue"
WCC_vegas_revenue_desc:0 "The military towns of Reno and Vegas have become rather profitable in their gambling and related operations. It appears the government could invest in these growing businesses and their nearby infrastructure, and use the profits to fund its various war efforts."
WCC_war_bonds:0 "Loyalist Bonds"
WCC_war_bonds_desc:0 "Bonds would go a far way in giving us much needed liquid funds for our war efforts while giving an opportunity to raise support for the cause. So buy your Liberty Bonds today citizen!"
 WCC_Elite_training:0 "Elite Training"
 WCC_Elite_training_desc:0 "We are now short of men, but we must not forget that one good soldier is worth more than a few cowardly novices. Whatever difficulties we may face, we must ensure that we have in our hands a determined and courageous army."
 WCC_High_morale:0 "High Morale"
 WCC_High_morale_desc:0 "In the face of our propaganda and abundant supplies, the morale of our soldiers has never been higher. This not only increased our hope of victory, but also more or less demoralized the insurgents who were hostile to us."
 WCC_Red_Ball_Express_team:0 "Red Ball Express Team"
 WCC_Red_Ball_Express_team_desc:0 "In the Rocky Mountains, low supplies are a common feature of marches. To solve this problem, General Eisenhower had decided to create a special unit to supply troops at the front. Since express deliveries are marked with a red mark on the way to indicate the urgency of the cargo, we will follow this practice and mark all of the unit's supply trucks in red to indicate the importance of the shipment. This unit will be called the Red Ball Express Team, and they will do everything in their power to keep our front-line lads from losing out due to supply problems."
 WCC_West_Point:0 "West Point Spirit"
 WCC_West_Point_desc:0 "West Point has always been the representative of the United States military Academy, and our loyal leader Marshal MacArthur also came from West Point. Guided by the spirit of West Point, our troops and officers will fight to bring back an old vision of America."
 WCC_invincible_army_of_the_West:0 "The Invincible Army of the West"
 WCC_invincible_army_of_the_West_desc:0 "After a series of military reforms and real combat tests, today's western Army has become a long-tested ace force. Led by Eisenhower and General Bradley, this army would defeat the rebels who had divided the United States and bring peace and stability back to the New World."
### Navy Path ###
WCC_navy:0 "American Navy"
WCC_navy_desc:0 "Only a few ships, and even fewer sailors, remained loyal to the American people. We need to take stock of our maritime situation."
WCC_great_white_fleet:0 "Great White Fleet"
WCC_great_white_fleet_desc:0 "The Great White Fleet was the height to American naval power. We should look back at it for inspiration. A great fleet of battleships and dreadnoughts will ensure we always have naval superiority."
WCC_protect_american_trade:0 "Protect American Trade"
WCC_protect_american_trade_desc:0 "Trade is the lifeblood of America. We should focus our naval doctrine on making sure that it is protected from enemy raids."
WCC_carriers:0 "Carrier Fleet Project"
WCC_carriers_desc:0 "Carriers are the wave of the future. We should invest in their research and construction to better project naval power."
WCC_battleships:0 "Battleship Research"
WCC_battleships_desc:0 "Battleships are the king of the high seas. We should start research into new models with bigger guns and better air protection."
WCC_battle_cruisers:0 "Battlecruiser Research"
WCC_battle_cruisers_desc:0 "Battlecruisers present a middle balance between heavy battleships and faster cruisers. We should ensure we have some in our navy."
WCC_coast_guard:0 "The Coast Guard"
WCC_coast_guard_desc:0 "Restoring the Coast Guard will ensure that trade moves smoothly, criminals are stopped at sea, and those in danger are rescued."
WCC_light_cruisers:0 "Light Cruiser Development"
WCC_light_cruisers_desc:0 "Lighter cruisers are important in anti-air operations, as well as attacking enemy destroyers and submarines. We should ensure our navy has a handful of these in order to stay balanced."
WCC_naval_aviation:0 "Naval Aviation"
WCC_naval_aviation_desc:0 "Naval aviation is the future of warfare on the high seas. We should ensure that our air designs are capable of being launched from carriers and destroying the enemy fleet without even endangering our own."
WCC_expand_dockyards:0 "Expand Dockyards"
WCC_expand_dockyards_desc:0 "Our dockyards are somewhat inadequate to fight a war on their own. We need to ensure that new naval production facilities are constructed to support the war effort."
WCC_submarine_development:0 "Submarine Development"
WCC_submarine_development_desc:0 "Submarines allow us to wreak havoc on enemy shipping and heavy ships. We should ensure that our designs stay up to date against enemy destroyers and anti-submarine tactics."
WCC_liberty_ships:0 "Liberty Ships"
WCC_liberty_ships_desc:0 "Our shipyards, previously dedicated to commercial shipping, can easily be converted to produce massive numbers of convoys to supply our allies around the world."
WCC_maritime_industry:0 "Maritime Industry"
WCC_maritime_industry_desc:0 "Our maritime tradition remains strong. We can leverage the commercial shipping industry to help our struggling democracy to survive."
WCC_new_admirals:0 "New Admirals"
WCC_new_admirals_desc:0 "Many admirals deserted to the traitors to the east. We should train a new generation of naval leaders to ensure our continued maritime dominance."
WCC_life_at_sea:0 "Expand the WAVEs"
WCC_life_at_sea_desc:0 "Women can serve many auxiliary roles in the navy, freeing up men for combat duty. While this might be socially controversial, it will significantly help the war effort."
WCC_marine_corps:0 "Expand Marine Corps"
WCC_marine_corps_desc:0 "The Marine Corps was the epitome of American power projection around the globe. From the shores of Tripoli to the halls of Montezuma, the Marines were always there. We should ensure they have modern equipment and training."
WCC_naval_training:0 "Naval Training"
WCC_naval_training_desc:0 "While the Naval Academy in Annapolis was destroyed in the fighting of the Civil War, we still have plenty of facilities able to train a new generation of naval leaders and sailors."
WCC_urban_warfare:0 "Urban Warfare Training"
WCC_urban_warfare_desc:0 "We need to enlarge the Marine Corps, and ensure that they are able to project our power around the globe."
WCC_coastal_bunkers:0 "Semper Fi"
WCC_coastal_bunkers_desc:0 "Semper Fidelis means 'always loyal'. The Marine Corps will always be a bastion of American liberty and democracy, and help spread these freedoms around the world."
WCC_america_rules_waves:0 "America Rules the Waves"
WCC_america_rules_waves_desc:0 "Following our extensive investments into naval research and construction, we have regained our place as one of the world's leading naval powers. Anchors away!"
WCC_air_force_reform:0 "Formation of an American Air Force"
WCC_air_force_reform_desc:0 "With the ongoing debate in the WCC Army, the air WCC officers that defected to our side have promised us great results if we separated the air branch from the army. The Western Command Air Force shall be formed, and will have to decide it's future plans."
WCC_expand_ACTS:0 "Expand the Air Corps Tactical School"
WCC_expand_ACTS_desc:0 "We are lucky enough that the American Army in the past relegated air officer training to the deep South, as we now possess access to the installations and officers from the Air Corps Tactical School in Maxwell Field, Alabama. However, in order to surpass the School set up in Langley Field in Virginia, we will need to expand on our installations."
WCC_fighters:0 "Fighter Development"
WCC_fighters_desc:0 "American fighter projects were halted during the 1920s due to a lack of funding from the government, leading to a disadvantage in fighter development. We must close this gap by funding design contests among different companies with the prize being obtaining a very profitable production contract for the plane that may outperform our enemy's."
WCC_le_may_reform:0 "LeMay Reform Plan"
WCC_le_may_reform_desc:0 "Curtis LeMay has proposed a bold plan of reform. Since the Air Force isn't meant to complement the army, he has proposed that the air force should strike at the heart of our enemies and cripple their industries of war. While his theoretical approach is sound, the final decision rests with the government."
WCC_air_field_expansion:0 "Air Field Expansion"
WCC_air_field_expansion_desc:0 "Part of LeMay's plan involves developing new air fields, as well as expanding existing ones. This will allow us greater capacity for air missions, and may assist with training as well. Better air infrastructure will give our airplanes a better chance in our wars."
WCC_naval_bombers:0 "Naval Bomber Development"
WCC_naval_bombers_desc:0 "With the shortcomings of our navy for protecting our shores, the air force has the duty to also protect the shores of our nation for whatever cost against any enemy who dare set foot in our homeland. As such, we will seek to complement the Navy's patrols with naval bombers scouting and intercepting any vessels whenever our fleet is too spread out or too far away to do so."WCC_bombers:0 "Bomber Development"
WCC_bombers:0 "Bomber Development"
WCC_bombers_desc:0 " Bombers, although a terror to behold, will enable us to project our power overseas. Our secret project also hinges on effective and safe bombers to deliver their secret payload."
WCC_radar:0 "R.A.D.A.R. Development"
WCC_radar_desc:0 "RADAR, the top-secret technology to detect air movement will allow our sky watchers to rest easy at night."
WCC_screaming_eagles:0 "'Screaming Eagles' Program"
WCC_screaming_eagles_desc:0 "With the ever growing presence of our air force and ever growing needs of the battlefield, a question has arisen between our army and air force officers: Could it be possible to combine the two to transport troops behind the battlefield in a manner that may change the face of the battle? In order to prove or disprove this theory, an experiment shall be undertaken."
WCC_rule_the_skies:0 "Rule the Skies"
WCC_rule_the_skies_desc:0 "Off we go, into the wild blue yonder, flying high into the sky. Our Air Force shall be the world's most advanced, and nowhere will be out of our reach."
WCC_strat_bomber_development:0 "Strategic Bomber Development"
WCC_strat_bomber_development_desc:0 "With the objective of our air force clear, we can focus on making bombers for the specific task of obliterating our enemy's industry."
WCC_bomb_em_back_to_the_stone_age:0 "Bomb Em' Back to the Stone Age"
WCC_bomb_em_back_to_the_stone_age_desc:0 "Once our Bombers are done with our enemies, they won’t be able to tell the difference between their land and primitive rocks. All of our enemies will be reduced to rubble!"
WCC_long_range_interceptors:0 "Long Range Interceptors"
WCC_long_range_interceptors_desc:0 "While fighters can secure the skies above the battlefields, the battle at the enemy's doorstep is usually too far away for them to step in to protect our bomber wings from the enemy fighters. To counter this, we have managed to create and improve heavier designs with longer to have bigger agility to stand a chance in air-to-air combat, and further investment in this area may yield great benefits."

#事件
wcc.1.t:0 "Western Command Center Requests Aid"
wcc.1.d:0 "In the United States, an outpost made up of Federalist Forces trapped in the West under General Omar Bradley is fighting a desperate fight for survival. They are now requesting aid from the entente in their fight against populism, socialism and the Pacific. Unlike the more ambiguously friendly MacArthur and Pacific States the WCC leadership seems far more respectful to the Entente and particularly Canada, and many of our advisors believe their survival would be in our best interests. Of course as others believe them to be a lost cause they recommend we do not loan them firearms, funds and small grouping of 'Independent Volunteers' as it would only antagonize a victorious faction."
wcc.1.a:0 "We must aid them"
wcc.1.b:0 "No, they are doomed anyways"

wcc.2.t:0 "Canada Sends Aid"
wcc.2.d:0 "It appears our diplomatic mission has paid off, with the WCC seemingly being the best ally Canada to choose in the war. Of course, there is no guarantee they are not going to aid other factions to hedge their bets, but at least we have the aid we need."
wcc.2.a:0 "Fantastic"

wcc.3.t:0 "Canada Refuses Aid"
wcc.3.d:0 "Our mission to Canada has failed! They appear to not believe we are capable of winning the war and, as such, have refused to support us."
wcc.3.a:0 "Bastards"

wcc.4.t:0 "Fate of PSA Generals"
wcc.4.d:0 "With the PSA having fallen to us, it is time to decide the fate of imprisoned members of their cause. Many are sympathetic to their desire to protect democracy though none will defend what they consider a rash decision to declare war on the federal government and nearly doom America to extremist ideologies that deny modern freedom. Nonetheless, we most would have their soldiers and officers rejoin America if they swear loyalty to the federal government, although doing the opposite will make allow a firmer grip of the West even if it will anger some officers."
wcc.4.a:0 "Conditional Amnesty it is"
wcc.4.b:0 "We can not forgive their treason"

wcc.5.t:0 "What of MacArthurists?"
wcc.5.d:0 "While we were willing to fight under MacArthur when it seemed the only means of defending Congress from the Red Guard, the Minutemen, the NDWL, the secessionists and an impractical and hypocritical Pacific Congress that sought to override the national government with its own, it became clear in time that MacArthur was not willing to give up power to either Congress, Eisenhower or Bradley and he would have to go. Now with MacArthur having fallen we must decide whether to offer him full amnesty, revive his reputation and gain his mens support or end the threat once and for all."
wcc.5.a:0 "Make MacArthur a General"
wcc.5.b:0 "Declare him a traitor"

wcc.6.t:0 "The Fallen Cause"
wcc.6.d:0 "The South has been felled once again, along with all of the generals whom either agreed with the Old Democrat agenda or had the misfortune of already serving their states when the war started. General Patton was their most prominent leader and many would have us offer him and his men amnesty while maintaining the NDWL as a terrorist organization. However, most others view their cause as beyond redemption and claim that we would be repeating the error of the First Reconstruction in going too easy on the radical white league allies, and as such it will be a bit of an uphill battle to offer them amnesty and ruffle some feathers. Of course, to jail them would mean dealing with the potential backlash."
wcc.6.a:0 "Conditional Amnesty"
wcc.6.b:0 "We must finish their cause"

wcc.7.t:0 "A Secret Proposal"
wcc.7.d:0 "With our foes having been felled in the war, the USA and the WCC are the only combatants left standing. We have demanded that MacArthur give up power in two months time, yet his reply surprised Eisenhower and Bradley. In a personal letter to each of them, MacArthur proposed a deal between the three of them to share power within a wider military council, made up of the top brass of the U.S. military. In this scheme, Eisenhower would have a near-autonomous military government overseeing the reconstruction of the former AUS territories, while Bradley's army would essentially govern the WCC and Pacific States. While MacArthur would still be the face of the regime, this would prevent him from having a total handle on the situation. While some generals consider this treachery, taking the deal could save lives, and Eisenhower and Bradley reason that perhaps more power would allow them to slowly overtake MacArthur and someday restore democracy. Of course, declining the deal would certainly lead to war, and in that case we should reach out to anyone we can..."
wcc.7.a:0 "Accept his offer."
wcc.7.b:0 "Seek allies against MacArthur"
wcc.7.c:0 "This is outrageous, attack!"

wcc.8.t:0 "WCC Demands!"
wcc.8.d:0 "The WCC has always had a tense relationship with MacArthur due to the generals leading it, Eisenhower and Bradley, having more loyalty to the Federal Government, Military, and Congress than to him, whom they distrust and view as an egomaniac. Now the tensions have come to a head, as they demand we relinquish some power in return for being re-annexed into the US. This deal would institute a ruling military council or committee, with MacArthur, Bradley, and Eisenhower as the main figures. Though MacArthur would lose his position at the top of the country, he would still retain significant power and a vast swath of the United States. If we do not sign the deal, we could face another war, one that we could lose. For now, this is the logical course."
wcc.8.a:0 "Very Well"

wcc.9.t:0 "MacArthur Accepts!"
wcc.9.d:0 "MacArthur has accepted our terms for peaceful reunifications and as such we have both prevented a potential tyranny and reunited America."
wcc.9.a:0 "God Bless America"

wcc.10.t:0 "WCC Reintegrates"
wcc.10.d:0 "Bradley and Eisenhower have acknowledged their lower rank to MacArthur and the United States, agreeing to hand over the WCC to him since he has agreed to hold elections, as promised. This is a relief, as they are known to have a tense relationship with MacArthur, making this a major victory for democracy and the battered nation. Of course, we should celebrate their actions and give them the highest honors we can to make the transition smoother."
wcc.10.a:0 "America is Saved!"
wcc.10.b:0 "Eh, lets go to war anyways..."

wcc.11.t:0 "MacArthur Assumes Command!"
wcc.11.d:0 "General MacArthur has decided he can no longer hold the East and now desires to move his outpost West, where we enjoy superior natural defenses. Of course, privately our leadership is not enthusiastic about this given Eisenhower and Bradley have a tense relationship with the General of the Armies and do not look forward to serving under him, especially given that MacArthur's faction and support base in the West are quite radical and now are even moreso after MacArthur sent word D.C. may be lost. However, our resources are few and that same faction could cause problems if we refuse, something we can not afford, so it appears we have little choice but to give in. Of course, rejecting him would be essentially a declaration of war as it would be a refusal to recognize his authority."
wcc.11.a:0 "Welcome him"
wcc.11.b:0 "Refuse him"

wcc.12.t:0 "WCC Welcomes Us!"
wcc.12.d:0 "The WCC has welcomed us to the West! As such we are preparing our expedition West, likely cutting through a neutral or friendly nation to reach it. Of course, with the situation now increasingly dire MacArthur's radical supporters in the West, nicknamed ' Radical Federalists' have put forward an extreme proposal to save America from the subversive extremists who threaten it and, in the process, us. Already, George Kenney and Richard K. Sutherland have joined them, necessitating MacArthur's reliance on them."
wcc.12.a:0 "We shall not fail"

wcc.13.t:0 "America Restored"
wcc.13.d:0 "Against all odds, we have not only survived, but thrived. The Western Command Center had relinquished all traitors and secured a better future for America, and now we can finally end the period of reconstruction. The United States has been restored and old glory now proudly flies over Washington. And everyone knows that the Military and President [WCC.GetLeader] will keep the nation safe. "
wcc.13.a:0 "God Bless America"

wcc.14.t:0 "Appointing Lippmann"
wcc.14.d:0 "Journalist Walter Lippman is a strong supporter of our recent policies, believing our government places pragmatism, specialization and technocratic merits above ideology, and as such he has recently risen to be the lead editor of the New Republic. His position on the responsibility of the intellectual elite to herd the masses into contentment has resulted in some of the Wise Men believing we should place him in charge of overhauling our journalistic education system wholesale in favor of 'Lippmannism', and expect media outlets to meet its qualifications or not be designated as accurate media by the government and our connections."
wcc.14.a:0 "Empower Lippmann"
wcc.14.b:0 "He's fine where he is"

wcc.15.t:0 "Cultivating Ties"
wcc.15.d:0 "What the Wise Men are willing to acknowledge is that the masses are no longer capable of mass democracy as we've known it, as it will only cause death, destruction and collapse. However, this does not mean we need to brutally subjugate them either. We must cultivate ties to the elite classes on the basis of their expertise, not on birthright. As such, we should attempt to place a higher emphasis on meritocracy in our government, with those qualify becoming new members of the political elite who still value science and liberalism. In the process we must shake up some of the old political machines."
wcc.15.a:0 "Of course"
wcc.15.b:0 "Take it slow"

wcc.16.t:0 "Experts Recommend lower tariffs"
wcc.16.d:0 "Some of our policy makers, most notably Dean Acheson, has recently recommended that we lower tariffs with our allies at once. Taking advice from classical economists and the theory of comparative advantage, they state that tariffs are a net negative to our economy, noting that trade will create access to a larger consumer surplus. "
wcc.16.a:0 "Very well"
wcc.16.b:0 "Not Yet"

wcc.17.t:0 "A New Federal Reserve"
wcc.17.d:0 "The Federal Reserve is being recreated with a higher emphasis on expertise in economics, particularly economic training or leadership in banking. As such, an internal debate has broken out over which economists we should favor, those who place a higher emphasis on fighting unemployment or fighting inflation. Naturally, those who are chosen will gain a significant edge in government circles, and as such some think we should keep out of it, and simply appoint approved economists who are approved by our think tanks and/or other institutions, and let them do what they will."
wcc.17.a:0 "Fight Inflation"
wcc.17.b:0 "Fight Unemployment"
wcc.17.c:0 "Be hands-off"

wcc.19.t:0 "Establishment of Policy Planning Staff"
wcc.19.d:0 "The Wise Man George F. Kennan has been appointed the head of the newly created Policy Planning Staff, established as a think tank to aid in the State Department in establishing strategic aims. In his newly prepared article, 'The Sources of Syndicalist Conflict', he recommends containing syndicalism through counter-propaganda and 'counterforce at a series of constantly shifting geographical and political points', stating that while syndicalism can never be at peace with capitalism due to its current ideology, it is weak in the long-run and we can avoid outright warfare with them. As such his proposals would entail strengthening the Entente and investing in further pro-Western propaganda."
wcc.19.a:0 "Follow the Report"
wcc.19.b:0 "Only invest in counter-propaganda"

wcc.20.t:0 "Lobbyist Competition"
wcc.20.d:0 "Lobbyists have proved to be a useful means of connecting the new technocratic class with the desires of larger industry, with the lobbyists being themselves experts in this regard. Of course, while rent-seeking will have to be opposed, this communication is essential to a healthy economy and grants simpler access to required and vital resources, and already lobbyists in the growing military industries are competing for further attention with those who desire tax cuts for civilian industries. Should we favor one?"
wcc.20.a:0 "Favor Neither"
wcc.20.b:0 "Favor Military Lobbyists"
wcc.20.c:0 "Favor Civilian Lobbyists"

wcc.21.t:0 "Recruiting Harriman"
wcc.21.d:0 "With our retaking of New England, there has been much discussion of which members of the educated elite of New England into our government. Of them, William Averell Harriman is one of the most accepted, and placing him in charge of some local thinks tanks could help facilitate control over the region. Of course, we could make him a diplomat as well."
wcc.21.a:0 "Appoint Harriman as a leader"
wcc.21.b:0 "Make Harriman a diplomat"
 wcc.22.t:0 "The meeting"
 wcc.22.d:0 "With the end of the Second American Civil War, the divided nation was finally united again under one banner. The tyrants of Washington, the bandits of the Great Lakes, the ultranationalists of the South, have now disappeared from public view. The remnants of the resistance either fled to the countryside or flew abroad, and the remnants of the resistance were forgotten over time. The Big three of the Western Command Center districts now face a country in shambles: the long civil war has torn apart the pre-war political order, and the current situation has proved that it is almost impossible to restore democracy any time soon. Therefore, the Triumvirate held an emergency conclave at this moment to decide on future leaders. As the three generals at the center of the power of the entire country, the Big Three differ in the course of future governance, although there is no conflict of political ideas that can completely tear them apart. Bradley's vision of democracy is derided by Lemay as "the second staging of an already failed farce"; Eisenhower's authoritarian elite government was said to have "put a veil on the SINS of corruption and dictatorship"; The military and political system of LeMay was directly opposed by the other two. Despite the constant disputes, the big Three eventually reached an ideological consensus. Soon, the leadership of the new government will be confirmed."
 wcc.22.a:0 "General Omar Bradley has secured his position"
 wcc.22.b:0 "Dwight D. Eisenhower won the support of the other two"
 wcc.22.c:0 "Curtis Lemay managed to convince Bradley and Eisenhower"
 wcc.23.t:0 "The struggle between civil and military forces"
 wcc.23.d:0 "With MacArthur's undoubted victory, the fires of rebellion throughout the country had died down. But there is growing skepticism within government and civil society about today's wartime military and political system. There were more and more demonstrations demanding the end of military rule, and MacArthur's Allies within the government were beginning to resent the military control of the government. It may be time for MacArthur to make a change - to placate public opinion and recruit political elites and civilians to replace most of the military in the government, or to maintain the military government in order to ensure long-term stability."
 wcc.23.a:0 "Bring civil elites and old government civil servants into the cabinet"
 wcc.23.b:0 "It is necessary to maintain military politics"
 wcc.24.t:0 "The fate of financiers"
 wcc.24.d:0 "In the Civil War, we received almost no assistance from financiers and capitalists throughout the United States. These daredevils either took their property north to New England or flew out of the country altogether. Now that we have ended the divisions of the Civil War, we have rounded up the rebellious financiers, bankers, and speculators. What the hell are we gonna do with these bastards?"
 wcc.24.a:0 "Arrest all the dirty financiers and confiscate their assets"
 wcc.24.b:0 "If they're willing to give away all of their money, we can cut them some slack"
wcc.27.t:0 "MacArthur Addresses Congress"
wcc.27.d:0 "General MacArthur has won the war and as such, announces a new nation to Congress, at least what is left of Congress that remained loyal to MacArthur. The Congress would serve to administrate civilian areas of the nation, while all other executive power would be wrapped in the military and devoted to combating socialist threats. While many suspect the speech and his recent 'conversion' in politics was due to a combination of his newly radicalized supporters and his lower powerbase outside of it, as well as the chaos of the nation, none dared disagree, as those few MacArthurists still in Congress applauded."
wcc.27.a:0 "Victory at last"
wcc.28.t:0 "Alvin Owsley appointed Legion Chief"
wcc.28.d:0 "Alvin Owsley was one of the few in the WCC to fervently support MacArthur's return, and as such he has been appointed as the lifetime executive of the American Legion for veterans. As nearly all power now rests in the military this is a massively powerful position, one he promises to use to support maintaining veteran support of the new state."
wcc.28.a:0 "Wonderful"
wcc.29.t:0 "The Blue Terror"
wcc.29.d:0 "In what is being dubbed an American 'Blue Terror', the military is wiping out the Syndicalists and Old Klan who once held a strong grasp over the East. With swift military tribunals only being afforded to high ranking militia members, commanders are often entrusted to have investigators find militia members in hiding and swiftly arresting them. The effects of the so-called terror against extremist is clear as their capabilities collapse and the military directly occupies these territories, often deciding which to keep and which to allow Congress to administrate."
wcc.29.a:0 "Lean towards direct control"
wcc.29.b:0 "Lean towards autonomy"

wcc.30.t:0 "Fate of DuPont"
wcc.30.d:0 "With New England back under our control we must decide what to do with those who worked against our interests, especially in the upper-class now that the Red Unions have already been broken. The DuPonts are responsible for funding extremist groups in the region that desired breaking from the US altogether as a goal while the so-called 'Federalists' wanted to be ruled by Canada. With the region under our control, we might be better off destroying the regions 'Radical' movement by nationalizing DuPont's factories, although their anti-syndicalism may be useful if we wish to give them conditional amnesty."
wcc.30.a:0 "Nationalize them"
wcc.30.b:0 "Conditional amnesty"
wcc.31.t:0 "Kangaroo Courts"
wcc.31.d:0 "Once, it was the case that MacArthur intended to give his enemies truly fair trials after the Civil War. His patience has run thin as of late, though, and he believes it is too dangerous to give these rabble a chance at being free. Instead, he has ordered what he calls "fair trials for men like them", in which the outcomes are often predetermined and the sentence is death by firing squad, at best. It is said that the worst fate is being taken away by the Central Bureau, a fate which everyone understands to be final. Though nobody knows exactly what occurs to these unfortunate prisoners, many whisper that they are used as test subjects in nuclear experiments to further the not-so-secret government nuclear program. Alvin M. Owlsey and Curtis LeMay have pressured MacArthur and urged him to ensure that nobody escapes justice. As a result, thousands of men and women are being eliminated through arrests, trials, and executions. This process will take some time, as we must round up the leaders of the various traitorous factions and put them on trial, but eventually, it will be done. The work may be ugly, but MacArthur will do whatever he must to ensure a safe future for true Americans."
wcc.31.a:0 "Traitors don't die, they just fade away..."

wcc.32.t:0 "Cut the Middleman Out"
wcc.32.d:0 "With the highest leaders and/or offenders dead or otherwise missing, we must now decide the fate of middle administrators, leaders, and generals. These men had ideological commitments to their cause but lacked the power to cause destruction on a mass scale. Still, they are traitors all the same, and MacArthur has deemed them worthy of severe punishments. These will vary from immediate executions to use in government programs to life in prison, but we will ensure that none of these 'citizens' see the freedom they stole from our people ever again."
wcc.32.a:0 "They will pray for peace."

wcc.33.t:0 "Military Camps"
wcc.33.d:0 "The fractured nature of the Civil War means that we are sorely lacking for manpower even after the war has been won. This can be easily remedied, though, by using prisoners in military camps. These prisoners will cook, clean, or work hard labor, depending on the nature of their crimes during the war. These are often low-level leaders of the rebellious factions from the Civil War, who had little power but still played a role in killing their fellow countrymen and tearing the nation apart. They should consider themselves lucky to be alive, and many indeed express gratitude at the chance to redeem themselves. Those who complain however are never seen again."
wcc.33.a:0 "You are remembered for the rules you break."
wcc.34.t:0 "No More Traitors"
wcc.34.d:0 "Now that we have successfully eliminated those responsible for the Civil War and its many horrors, we can turn our attention to our people. Particularly, we should educate our children. These men and women who betrayed our great nation will serve as examples of disobedience, corruption, and evil. We must teach our children the importance of the nation if we are to avoid another such catastrophe in a generation's time. So, let us begin."
wcc.34.a:0 "Americans never quit."

wcc.35.t:0 "Cabinet Candidate: Allen Dulles"
wcc.35.d:0 "The Dulles brothers have particularly interested MacArthur for some time, sharing similar ideas on issues of the day, especially syndicalists. However, it is Allen Dulles in particular that interests MacArthur, for his tougher personality and ideas about foreign policy. Dulles would no doubt pressure the administration to take a more aggressive stance on the foreign stage, a pressure that MacArthur would be happy to have. Besides that, appointing the man would give us more legitimacy in the eyes of our people without endangering the interests of the military. Shall we appoint him?"
wcc.35.a:0 "Yes, bring him in!"
wcc.35.b:0 "No, keep the military advisors"

wcc.36.t:0 "Cabinet Candidate: Theodore Kaufman"
wcc.36.d:0 "Theodore N. Kaufman is a curious figure. He has supported positions such as sterilization for Americans so that their children will not have to fight in civil wars and staying out of European conflicts at all costs. These positions were ostensibly taken to secure as much security as possible for America. More recently, he has supported a sterilization program for the worst traitors from the Civil War, preventing them from breeding and passing on their traitorous blood. If it is applied in a concentrated fashion over many years, he argues that we could even cease to see a birth rate entirely in such areas. MacArthur has shown some interest in these ideas, though of course such a policy would only ever be pursued against criminals. Shall we appoint this man and let him test his theories?"
wcc.36.a:0 "Yes, admit him to the cabinet!"
wcc.36.b:0 "No, we will retain our military advisors"

wcc.37.t:0 "Revolt in Indiana!"
wcc.37.d:0 "The city of Gary in Indiana is one that is rather close to Chicago, and is an industrial hub. Hence, it was heavily influenced by the syndicalist movement before the Civil War. Now that the war is over, though, they have apparently decided to continue resisting. Tensions have escalated in the city as it has slowly risen to be one of the most troublesome areas in the entire country. Only a few days ago, rioters crossed the line, killing three soldiers who were attempting to block a street from their advance. MacArthur, hearing this news, was furious, and vows to take action against the population there. However, nobody seems to agree on what should be done. Some argue that thousands of them should be sent off to military work camps. After all, we could always use more manpower at these camps. Others believe that we should arrest the worst criminals and put them aside for testing in the government's nuclear program. They could die a grizzly death, but at least they would be serving their country for once in their lives. Still others advocate a further wealth confiscation, punishing them economically and dooming some of them to starvation. Whatever we decide, it seems that Theodore Kaufman will be close behind our men, eager for an excuse to test his sterilization theories. What should we decide?"
wcc.37.a:0 "Send them off to camps"
wcc.37.b:0 "Give them a patriotic end"
wcc.37.c:0 "Hurt their wallets"
wcc.38.t:0 "Ban the Old Parties"
wcc.38.d:0 "With MacArthur holding onto power many allies such as LeMay, Kennan, Sutherland and the American Legion leadership is advising us to organize our supporters under a unified political party, rather than simply having known supporters of the military government. While it would take some getting used to, the Patriot Party would greatly aid in our efforts."
wcc.38.a:0 "Found the Party"
wcc.39.t:0 "Cabinet Candidate: Henry Morgenthau Jr."
wcc.39.d:0 "Henry Morgenthau Jr. has had an eventful few years. He was in the United States, then in the West, and now he is up for consideration in our government. Morgenthau's ideas about dealing with different regions of the United States are somewhat controversial, but MacArthur has shown a willingness to listen to what he has to say. One understanding his religious affiliation would understand his distaste for the now-defeated South, which he views as a region that has risen up traitorously on two occasions now. As such, he believes this region especially should be punished. To do this, he proposes a "Morgenthau Plan", in which the South will be de-industrialized, as he says it should be and always has been. While this idea may not be tenable on a wide scale, it has certainly given MacArthur some ideas for how to punish the Southerners, particularly the Fordists, and he believes Morgenthau has enough credentials to serve as a useful economic advisor. Shall we appoint him?"
wcc.39.a:0 "Yes, send him in!"
wcc.39.b:0 "No, his ideas are too extreme..."
wcc.40.t:0 "States of the Union"
wcc.40.d:0 "The most troublesome regions for our military have been the many towns and cities we control across the country. We simply do not have enough manpower to control them effectively, and would need more men if we were to do so. However, we could also hand them over to hand-picked civilian administrators, perhaps former politicians who were loyal to MacArthur during the war. Should we grow our ranks to be able to control these areas, or leave it up to local administrators?"
wcc.40.a:0 "Keep them under our direct control"
wcc.40.b:0 "Hand them over and watch them carefully..."

wcc.100.t:0 "A Banner for the Western Command"
wcc.100.d:0 "With the 30-Day Deadline’s end ever encroaching, it has become increasingly clear that America will once more descend into the horrors of fratricide for the second time in under a century. With this war becoming seemingly inevitable, serious thought has now gone into finalizing the flag that our forces and temporary government shall fly until this wretched war is won. As a detachment of the rightful Federal government, many suggest that the design we go with incorporate the proven American color of Blue, for it can not be mistaken for Syndicalist sympathy or cowardly surrender like the other two colors that adorn the glorious Stars and Stripes. However, many within our junta instead wish to further distance ourselves from the Federal government and the failed ideas of the old Union, and instead wish to adopt a black banner instead, symbolizing our strength and resolve in the face of conflict. Whichever design we go with shall become the formalized ‘national’ flag of the Western Command Center until the end of this brewing conflict, serving as the official rallying flag of our forces until we are graced with victory or crushed beneath the radical forces that assail our once prosperous republic."
wcc.100.a:0 "A banner of blue to show our dedication to the old freedoms of the Union."
wcc.100.b:0 "A banner of black to make ourselves more distinct from the Federal government."
wcc.100.c:0 "A banner of black and bordered with tan to further make our command distinct."

wcc.101.t:0 "Dressing for an Address"
wcc.101.d:0 "Against all expectations and odds, General Douglas MacArthur has lead his forces to victory in the civil war through blood, sweat, and steel. Once more taking his rightful place in the Oval Office, General MacArthur, by all accounts, is a changed man. No longer is he the servant of larger powers; neither the fools that languish in Congress, nor the Fat Cats of Wall Street. No, MacArthur serves only one man, and one vision. This man, of course, is himself, and his dream is the vision of a perfect and pure America, free from the taint of radicalism and lesser men. With the conclusion of the Civil War, that vision must be manifested. In order to facilitate its even swifter completion, the General has deemed it necessary to address the people of America, now once again united, and show them the future, explaining the part they must play if America is to remain loyal and pure. Most important of all though, MacArthur must play his part.\n\nWhat is one to wear to such an occasion? While yes, a good speech and fine orator skills can get you far, if you want to make a lasting impact, one's wardrobe is vital. Due to the sudden nature of this address, and due to the fact that he is only just returning to DC, MacArthur's wardrobe is... lacking, to say the least.\n\n Obviously, the General could simply remain in his now famous military fatigues, signaling to the people that militarily rule is here to stay. A slightly less orthodox idea for an outfit has come from MacArthur's newest chief of stuff who has suggested dying the General's fatigues blue, giving him the strong appearance of a military dictator, showing the American people who is truly in charge in this brave new world. Also within MacArthur's limited wardrobe is a suit, one he'd normally wear to the church services he hardly ever goes to. By wearing such a suit, he would give off more 'civil' vibes, perhaps enduring him slightly in the eyes of the citizenry. The last option open to the savior of America is also by far the strangest.\n\nIn a recent haul of tribute from traitors holdup in an old theater was a Roman toga and laurels, used in productions of Shakespeare's Caesar. Due to his long time status as the 'American Caesar,' the General seized these items, seemingly as a joke. However, with his address up and coming, he has expressed quite a lot of fascination with wearing the costume on top of his fatigues, to 'show the American people that the United States is gone, and in it's place has risen a new nation.' While obviously ridiculous, it would indeed get his point across, and none would be able to doubt that the United States of old was dead. Regardless, the General's address is only a few hours away, and a decision must be made."
wcc.101.a:0 "My fatigues will get my point across."
wcc.101.b:0 "Break out the dye, blue matches my eyes!"
wcc.101.c:0 "My Sunday Best is sure to do the trick."
wcc.101.e:0 "Veni, vidi, vici! America is reborn, and my outfit shall match that!"

