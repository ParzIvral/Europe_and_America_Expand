WCC_help_economy_mission:0 "Deal with the Great Depression"
WCC_help_economy_mission_desc:0 "The Great Depression has left the United States reeling, and President Hoover's government has been struggling to deal with the fallout. The last hope is to pass a bill that will finally get some relief in the hands of those who need it - if Congress can work quickly enough."
WCC_oldorder_act_quickly:0 "Act Quickly"
WCC_oldorder_act_quickly_desc:0 "Now that the election is over, the new government will need to take action - and quickly. Failure to act will likely mean intervention by the military to solve the crisis, though even acting carries no guarantee of the political crisis being solved."
WCC_long_act_quickly:0 "Act Quickly"
WCC_long_act_quickly_desc:0 "Now that the election is over, the new government will need to take action - and quickly. Failure to act will likely mean intervention by the military to solve the crisis, though even acting carries no guarantee of the political crisis being solved."
WCC_reed_act_quickly:0 "Act Quickly"
WCC_reed_act_quickly_desc:0 "Now that the election is over, the new government will need to take action - and quickly. Failure to act will likely mean intervention by the military to solve the crisis, though even acting carries no guarantee of the political crisis being solved."
 WCC_expanding_the_league:0 "Expanding the League"
WCC_expanding_the_league_desc:0 "We should work to expand the League of American States so that all countries in both North and South America are a part of it."
WCC_invite_to_league:0 "Invite [From.GetNameDef] to the League"
WCC_invite_to_league_desc:0 "Perhaps an invitation should be sent to the [From.GetAdjective] government, to see if they are interested in joining our alliance."
WCC_recent_league_invite:0 "Has sent an invitation within the last month"
WCC_same_wars_as_FROM:0 "Any enemy is also at war with [From.GetNameDef]"
WCC_same_wars_as_RUS:0 "Any enemy is also at war with [RUS.GetNameDef]"
WCC_same_wars_as_GER:0 "Any enemy is also at war with [GER.GetNameDef]"
WCC_same_wars_as_JAP:0 "Any enemy is also at war with [JAP.GetNameDef]"
WCC_same_wars_as_AUS:0 "Any enemy is also at war with [AUS.GetNameDef]"
WCC_same_wars_as_Entente:0 "Any enemy is also at war with the Entente"
WCC_is_neutral_country:0 "is not in any faction (unless in a faction with us)"
WCC_Pan_American_Development_Foundation:0 "Pan-American Development Foundation"
WCC_Pan_American_Development_Foundation_desc:0 "The Pan-American Development Foundation(PADF) is the developmental arm of the League of American States. In this role, PADF works with public and private partners to implement socio-economic development and disaster relief for the members of the League of American States so that the goal of a Hemisphere of Opportunity for All can be achieved. We do this by engaging community-based groups, non-governmental organizations, national and local governments, multilateral organizations, and the private sector in the process of implementing appropriate solutions for sustainable development."
WCC_develop_ally:0 "Develop Closer Ties with [From.GetNameDef]"
WCC_develop_ally_desc:0 "With a little push, we can help develop our allies throughout the Americas, to strengthen their economies and help them stand a little taller on their own."
WCC_install_league_puppet:0 "Install Friendly [From.GetAdjective] Government"
WCC_install_league_puppet_desc:0 "[From.GetNameDefCap] is weak enough that we should consider installing a friendly and more subservient government - for their own protection, of course."
WCC_new_monroe_doctrine:0 "The New Monroe Doctrine"
WCC_new_monroe_doctrine_desc:0 ""
WCC_attack_canada:0 "Attack Canada"
WCC_attack_canada_desc:0 "We have traditionally been on friendly terms with our neighbours to the north... except when we haven't. If the time comes when Canada is controlled by an unfriendly government or has decided to occupy American lands, then the time has also come for us to change the nature of our relationship."
WCC_attack_mexico:0 "Attack Mexico"
WCC_attack_mexico_desc:0 "Our preference would be that Mexico was ruled by a friendly government, and kept to its own business. If that is not the case, we cannot ignore that it sits on our borders - borders we will actively protect, even if it means invading our neighbours to the south."
WCC_attack_phillipines:0 "Attack the Philippines"
WCC_attack_phillipines_desc:0 "As the former guardians of the Philippines, we have the right to concern ourselves with what has become of their government following the end of the civil war. If need be, we will liberate them from oppression once again."
WCC_claim_phillipines:0 "Claim the Philippines"
WCC_claim_phillipines_desc:0 "As the former guardians of the Philippines, we have the right to concern ourselves with what has become of the islands following the end of the civil war. If need be, we will liberate them from oppression once again."
WCC_reconstruction_decisions:0 "Rebuilding America"
WCC_reconstruction_decisions_desc:0 "With the civil war now at an end, we must heal the scars that have come from it."
WCC_currently_rebuilding:0 "Already focused on reconstruction in an American region"
WCC_rebuild_new_england:0 "Rebuild New England"
WCC_rebuild_the_south:0 "Rebuild the South"
WCC_rebuild_the_south_atlantic:0 "Rebuild the South Atlantic States"
WCC_rebuild_the_steel_belt:0 "Rebuild the Steel Belt"
WCC_rebuild_the_west:0 "Rebuild the West"
WCC_rebuild_rockies:0 "Rebuild the Rocky Mountain States"
WCC_rebuild_the_pacific_coast:0 "Rebuild the Pacific Coast"
WCC_rebuild_alaska:0 "Rebuild Alaska"
WCC_rebuild_hawaii:0 "Rebuild Pacific Islands"
WCC_rebuild_puerto_rico:0 "Rebuild Puerto Rico"
WCC_reclaim_new_england_decision:0 "Reclaim New England"
WCC_reclaim_new_england_decision2:0 "Reunite with New England"
WCC_reclaim_alaska_decision:0 "Reclaim Alaska"
WCC_reclaim_hawaii_decision:0 "Reclaim Hawaii"
WCC_capital_returns_to_dc:0 "Move the Capital back to Washington D.C"
WCC_rainbow_war_plans_decisions:0 "American War Plans"
WCC_rainbow_war_plans_decisions_desc:0 "The civil war may be over, but war yet remains a possibility for the country. Towards that end, we must choose between our enemies and allies carefully."
WCC_join_entente:0 "Join the Entente"
WCC_join_entente_desc:0 ""
WCC_join_canada_tech:0 "Join ISAC"
WCC_join_canada_tech_desc:0 "We should join the ISAC and add our scientific expertise to it."
WCC_war_plan_orange:0 "The Japanese Threat"
WCC_war_plan_orange_desc:0 "Japanese ambition is a threat to both our nation and the common good. The time has come to take a stand against it."
WCC_war_plan_gold:0 "The Syndicalist Threat"
WCC_war_plan_gold_desc:0 "The French syndicalists have reached a point where we cannot stand idly by and allow them to continue their domination - we must take a stand."
WCC_war_plan_black:0 "The German Threat"
WCC_war_plan_black_desc:0 "German imperialism has reached a point where we cannot stand by and say it is enough that they are defending themselves - for the sake of freedom, we must take a stand."
WCC_war_plan_red:0 "The Soviet Threat"
WCC_war_plan_red_desc:0 "We should have known the Russians couldn't be kept down for long. Their embracing of syndicalism has led them to becoming a pre-eminent threat to the entire world, one which we cannot stand by and simply watch."
WCC_war_plan_blue:0 "The Russian Threat"
WCC_war_plan_blue_desc:0 "Russian ambition has become a threat to both America and the entire world. We must take a stand against it, lest their armies eventually come ashore."
WCC_work_with_allies:0 "Work with [From.GetAdjective] Allies"
WCC_work_with_allies_desc:0 "We should use American know-how to aid our allies in [From.GetNameDef], sending them much-needed equipment and advisers."											 
WCC_dominated_france_russia:0 "Has dominated both France and Russia"
WCC_owns_american_claim:0 "Owns land claimed by us"
WCC_owns_fifty_states:0 "Owns at least 50+ states"
WCC_deal_with_terrorists_decisions:0 "Destroy Rebel Terrorists"
WCC_deal_with_terrorists_decisions_desc:0 "A number of rebel groups refuse to lay down their arms despite our victory in the civil war. We must deal with these terrorists once and for all to bring peace to America."
WCC_fight_socialist_terrorists:0 "Fight Socialist Terrorists"
WCC_fight_longist_terrorists:0 "Fight Longist Terrorists"
WCC_progressive_policy_decisions_desc:0 "The Progressive Party's platform has a number of laws and policies it will strive to pass."
WCC_progressive_desegregate_the_military:0 "Desegregate the Military"
WCC_progressive_desegregate_the_military_desc:0 "'Americans of all races come to America seeking a better life, and Americans of all races seek to fight and preserve American Liberty against her enemies regardless of their race. Yet for far too long that has not been the case and we have segregated the Army and diminished the Light of Liberty just a little. Yet, that ends today for the Army shall no longer be Segregated/'"
WCC_progressive_railroad_nationalization:0 "Nationalize the Railroad"
WCC_progressive_western_investment:0 "Invest in the Western States"
WCC_progressive_great_lakes_waterway:0 "Great Lakes Waterway"
