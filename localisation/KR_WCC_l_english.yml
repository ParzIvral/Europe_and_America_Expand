#选举国策
 WCC_last_bastion:0 "Rekindle the Fire of Democracy"
 WCC_last_bastion_desc:0 "We are the last bastion of freedom and democracy in America. We alone now carry the torch of freedom and democracy."
#国家民主党
 WCC_authoritarian_democrats_in_power:0 "National Democrats Elected"
 WCC_authoritarian_democrats_in_power_desc:0 "William Randolph Hearst's National Democratic Party and Federalist sympathizers have won the day on the back of promises to stabilize the Pacific, bring riches to its proper citizens and most importantly, end the war with the Federalists as soon as possible. It is a new day in the Pacific!"
 WCC_raise_tariffs:0 "Raise Tariffs"
 WCC_raise_tariffs_desc:0 "We must be protected from foreign competition at all costs if we are to remain self-reliant. High tariffs for virtually all goods, with the exception of some agricultural goods, is needed in this endeavor, with the resulting income going to national projects and existing services."
 WCC_slash_taxes:0 "Reward Success"
 WCC_slash_taxes_desc:0 "Why do the rich get richer while the poor gets poorer cries the syndicalist? They are correct, but wrong that capitalism is the culprit, when it has been the lack of incentives and opportunities of wealth to expand. Taxes for the wealthy will be slashed, especially the inheritance tax, with our recent tariff income compensating for the cost."
 WCC_american_festivals:0 "American Festivals"
 WCC_american_festivals_desc:0 "The people may have their economic goods but what of the circuses, festivals and national events that once brought boundless entertainment to the populace? Funding such festives will increase not only our governments popularity but patriotism and unity among the populace."
 WCC_state_trusts:0 "Municipal Ownership"
 WCC_state_trusts_desc:0 "Utilities such as electricity, water, gas and telephones can not be entrusted to only a handful of private companies without oversight. The government will purchase a share of these companies and shift towards partial nationalization, with local municipalities either purchasing contracts for services from approved companies or running it directly with Federal approval."
 WCC_roaring_parties:0 "Roaring Parties"
 WCC_roaring_parties_desc:0 "One of Hearst's favorite activities from the roaring 10's and early 20's, extravagant parties not only increase confidence in our economy but will help the state establish connections between them and the upper-class, as well as help solidify them into a more cohesive, appeasable force. Raise a glass, for the down times are over!"
 WCC_state_unions:0 "Municipal Ownership"
 WCC_state_unions_desc:0 "Utilities such as electricity, water, gas and telephones can not be entrusted to only a handful of private companies without oversight. The government will purchase a share of these companies and shift towards partial nationalization, with local municipalities either purchasing contracts for services from approved companies or running it directly with Federal approval."
WCC_media_regulation_act:0 "Media Regulation Act"
WCC_media_regulation_act_desc:0 "Our most dangerous foes have been quashed and we can finally end the litany of newspapers and reporters whom seek the destruction of the state! The Media Regulation Act will allow the new Broadcasting Division of the Federal Police to assemble a list of prominent radicals and ban their publications at once before another coup attempt forms against America."
WCC_investigate_gop:0 "Investigate the GOP"
WCC_investigate_gop_desc:0 "There can be little doubt that the GOP and their former friends in the Progressive Party and Democratic-Republicans make up Hearst's most dangerous critics since the collapse of the Commonwealth Party. That they put the interests of international bankers and foreign governments before our own is undeniable and their organization shall be investigated for potential bribery and corruption."
WCC_yellow_peril:0 "Yellow Peril"
WCC_yellow_peril_desc:0 "Hearst has been vocal in his concern that the "Yellow Races" seek to overtake the "White Race", formerly through immigration but now, with the weakening of America, through imperialism. The Pacific belongs to America, not Hirohito or the Chinese. Our publications and government will alert the public to this threat and the Tenney Committee will investigate possible East Asian collaborators."
WCC_national_industrial_administration:0 "National Industrial Organization"
WCC_national_industrial_administration_desc:0 "The economy is still struggling to recover from the combined attacks of syndicalist strikes, the Stock Market Crash, Great Panic, Black Monday and now destruction of the war. The National Industrial Administration headed by Hugh S. Johnson will work with industry leaders to end unsafe practices, price gouging and unlivable wages, encouraging class collaboratism."
WCC_punish_hawaii:0 "Punish Hawaii"
WCC_punish_hawaii_desc:0 "Did Hawaii truly believe that they could walk away from betraying the United States? They must be made an example of and their sugar production put to full use. They will have one opportunity to accept the conditions put onto the vanquished, for that is the fate of traitors who spit on America."
WCC_renovate_california:0 "California Dreaming"
WCC_renovate_california_desc:0 "California can not be allowed to fall on hard times just because of a few bumps in the road! We shall make a mass effort at expanding California's potential by clearing forestry, swamps and other natural obstacles to allow for greater business potential. Hearst Castle will likewise be seeing an expansion to usher in our cultural Golden Age."
WCC_mine_mine_mine:0 "Mining Operations"
WCC_mine_mine_mine_desc:0 "The state needs income and where better to acquire it then the national resources of the Pacific? State operated mining shall be operated by the NIA's new Mining and Resource Division, which will focus on acquiring goods in the Northern Pacific States and sell the resources to the highest bidder. A win-win for all involved."
WCC_federal_police:0 "Federal Police"
WCC_federal_police_desc:0 "In a nation overrun with crime and rebels it is clear the older methods of executive enforcement were badly outdated and far too slow to be effective. The Federal Police shall be made up the best of American officers and National Guardsmen, overseen by National Democratic Party militants, ranking above local law enforcement and answering directly to Hearst without question."
WCC_tenney_committee:0 "Tenney Committee"
WCC_tenney_committee_desc:0 "Congressman Jack Tenney is one of the most ardent anti-syndicalist, anti-radical NDP supporters in politics, and as such we should oblige his request to be put in charge of an empowered special committee devoted to investigating and rooting out radicalism, starting with Sinclair's Commonwealth Party."
WCC_demand_respect_from_canada:0 "Demand Canadian Tribute"
WCC_demand_respect_from_canada_desc:0 "Enough of Canada's foolishness! They seize American States and hover over America with predatory eyes, desiring to force us to join their war in Europe at our cost and their benefit, with nothing to show for it. They should contribute to our coffers in return for saving the Pacific, and our borders, from syndicalism."
WCC_nationalize_liquor:0 "Nationalize Liquor"
WCC_nationalize_liquor_desc:0 "While the "Dry" supporters were correct that liquor tended to attract shady elements and cause social instability, it is fairly obvious that passing prohibition on the local and state level has only increased crime. With the state needing additional funds, it is time to implements Hearst's common sense solution to nationalize liquor."
WCC_mexican_border_raids:0 "Mexican Border Raids"
WCC_mexican_border_raids_desc:0 "The bandits that make up the Mexican government believe they can get away with raiding and trafficking across our border, laughing at our supposed inability to strike back. It is time to return the favor and be compensated for our stolen goods."
WCC_tribunals_for_gangsters:0 "Tribunals for Gangsters"
WCC_tribunals_for_gangsters_desc:0 "With the implementation of the Federal Police we must set a more clear code of enforcement for them to follow that is not interfered with by other branches of government. Military tribunals will be held for captured members of organized crime followed by (if found guilty) summary execution."
WCC_executive_construction:0 "Executive Construction Projects"
WCC_executive_construction_desc:0 "America is famous for its massive skyscrapers and sprawling cities. We are a country with vast wealth and resources, and we shall use these to construct the largest and most extravagant structures the world has ever seen. Architects advocating a futurist aesthetic have caught Hearst's eye, and he plans to make these buildings in that image. The cost may be big, but Hearst's vision is bigger."
#自由共和派
 WCC_social_liberals_in_power:0 "Democratic-Republicans Elected"
 WCC_social_liberals_in_power_desc:0 "The Democratic-Republicans have won the [GetYear] election! Their agenda is a continuation of the pre-Civil War progressive wing of the Republican party, prioritizing liberal free trade, progressive social policies, and a moderate welfare state." 
 WCC_progressive_taxation:0 "Liberal Taxation"
 WCC_progressive_taxation_desc:0 "Ideally, taxation should strike a balance between allowing people to still have enough money to spend on consumer and luxury goods, and supporting government programs. The Progressive Party's tax plan ensures this will be the case."
 WCC_public_works:0 "Work for Welfare"
 WCC_public_works_desc:0 "Under the new Works Progress Administration public work projects will be available for those on relief or are unemployed which serves a two-fold purpose; they will help repair the damage wrought by the Civil War and they will provide valuable work opportunities for those whom need it most, especially veterans."
 WCC_create_the_ccc:0 "Create the CCC"
 WCC_create_the_ccc_desc:0 "By creating the Civilian Conservation Corps, or CCC, we will gain a large workforce capable of restoring infrastructure destroyed in the Civil War."
 WCC_national_youth_adminstration:0 "National Youth Administration"
 WCC_national_youth_adminstration_desc:0 "Unemployment breeds radicalism. We must ensure that the young men demobilized from the war have meaningful employment, or we will see a rise in the radicalism we spent the last few years attempting to suppress."
 WCC_chautauqua:0 "Chautauqua"
 WCC_chautauqua_desc:0 "The Chautauqua Institution is a prominent retreat in upstate New York that promotes progressive values. We should introduce its leading thinkers to the national stage, so they can better promote their theories."
 WCC_brain_trust:0 "Brain Trust"
 WCC_brain_trust_desc:0 "The group of young new progressive Senators elected in the Farmer-Labor ticket have been deemed the 'Brain Trust' due to their Ivy-League education and radical proposals for reforming the country."
 WCC_liberal_unions:0 "Support Liberal Unions"
 WCC_liberal_unions_desc:0 "Not all unions are nests of syndicalism. Some actually stand for the betterment of the working class, rather than just advancing the selfish goals of their leaders. We should support these unions, both to protect our workers and undercut syndicalists still hiding in the country."
 WCC_banking_act:0 "Banking Act"
 WCC_banking_act_desc:0 "This act will require a certain amount of reserves and interest rates for deposits at member banks, as well as giving the Board of Governors control over some tools of monetary policy. The Board will also have authority over discount rates in each Federal Reserve district."
 WCC_farm_security_act:0 "Farm Security Agency"
 WCC_farm_security_act_desc:0 "American farms were devastated in the war. By creating a federal agency responsible for protecting farmers, we can ensure agricultural prosperity and security."
 WCC_medicare:0 "Medicare"
 WCC_medicare_desc:0 "Medicare is a radical new piece of legislation proposed by leading Farmer-Labor politicians, and will enable our poorer citizens to get the medical treatment they need."
 WCC_agricultural_adjustment:0 "Agricultural Adjustment Act"
 WCC_agricultural_adjustment_desc:0 "There are many ideas for how to help our farmers in this crisis. One idea states that we should create the AAA, which will boost agricultural prices for farmers while reducing surpluses. The government will use this to ensure their farmers can stay afloat in these desperate times."
 WCC_mathematical_tables_project:0 "Mathematical Tables Project"
 WCC_mathematical_tables_project_desc:0 "There is a misconception that the unemployed masses of America are uneducated and lazy. We will prove that this is not true. To do this, we have found some of the most talented and intelligent individuals in the country who, despite their intellect, find themselves out of luck. These individuals will tabulate higher mathematical functions among other things."
 WCC_free_trade1:0 "Support Free Trade"
 WCC_free_trade1_desc:0 "Free trade is the building block of a strong economy. We should ensure that tariffs are struck down, and that barriers to free trade are lifted with our allies and neutral countries around the globe."
 WCC_labor_relations_act:0 "Labor-Relations Act"
 WCC_labor_relations_act_desc:0 "Poor relations between the owners and working classes was a major spark for the Civil War. We need to enact legislation that will ensure workers are protected from exploitation."
 WCC_federal_one:0 "Federal One Project"
 WCC_federal_one_desc:0 "Industrial workers aren't the only people who have to eat. The government will employ thousands of artists, musicians, actors, writers, and other cultural figures. Noone shall be denied employment discriminately in these trying times, and the work these people do is just as important as the work of anyone else. Let us give our people dignity."
 WCC_freed_currency:0 "Gold Reserve Act"
 WCC_freed_currency_desc:0 "This act will require all gold held by the Federal Reserve to be put into the hands of the U.S. Department of the Treasury. This will allow us to use monetary gold stuck for the good of the country and to protect our currency system from foreign practices."
#共和党
 WCC_market_liberals_in_power:0 "Republicans Elected"
 WCC_market_liberals_in_power_desc:0 "The Republican Party, champions of free trade, deregulation, and the financial sector, have won the [GetYear] elections. Citizens can expect to see lower taxes, better prices, and a return of the can-do individualist spirit of American capitalism."
 WCC_settelment_movement:0 "Settlement Movement"
 WCC_settelment_movement_desc:0 "The Settlement Movement was popular in pre-Weltkrieg England and America, and focused on bringing the rich and poor together in 'settlement houses' to better understand each other. We should encourage a revival of this movement in these difficult social times."
 WCC_trust_busting:0 "Trust Busting"
 WCC_trust_busting_desc:0 "Large trusts were a major rallying cry for the CSA. We need to break them up to prevent radicalism from sprouting its ugly head again."
 WCC_securities_act:0 "Securities Act"
 WCC_securities_act_desc:0 "Many are fearful of the large-scale confiscations of wealth carried out by numerous governments of the world in recent decades. We need to enact legislation to reassure the people that their property is theirs and theirs alone."
 WCC_efficiency_movement:0 "Efficiency Movement"
 WCC_efficiency_movement_desc:0 "30 years ago in the height of the Progressive Era, the Efficiency Movement tried to eliminate superfluous waste from the household and the workplace. With the economy still recovering from the recent blows, we should try and bring the movement back into the public consciousness."
 WCC_incentivize_charity:0 "Incentivize Charity"
 WCC_incentivize_charity_desc:0 "Currently there is a large swath of the population that needs our aid but as usual direct government intervention would be inefficient compared to private intervention. Instead our public service campaign will urge the wealthy to donate, offering a tax break for anyone who does and honoring those whom give the most by honoring their deeds."
 WCC_education_philanthropy:0 "Education Philanthropy"
 WCC_education_philanthropy_desc:0 "The richest businessmen usually attended a small set of elite universities, like the Ivy Leagues, Stanford, and the University of Chicago. We should create scholarships to ensure that those less fortunate can also attend these beacons of learning."
 WCC_hollywood_glamor:0 "Hollywood Support"
 WCC_hollywood_glamor_desc:0 "Many prominent Hollywood actors and producers support the Republican cause. We should enlist them in creating films that promote Republican values to the rest of the country."
 WCC_infastructure_investment:0 "Infrastructure Investment"
 WCC_infastructure_investment_desc:0 "One of the few reliable positives the government can provide for the economy is infrastructure, which helps facilitate business around the nation. Let us continue these national projects in the style of Abraham Lincoln."
 WCC_local_budgeting:0 "Local Budgeting"
 WCC_local_budgeting_desc:0 "Decentralization of the economy makes up much of the backbone of our beliefs and so it should go with the national budget, with local governments being given greater flexibility to set budgets and being recognized by our political leaders for saving money where they can."
 WCC_naval_expansion:0 "Naval Expansion"
 WCC_naval_expansion_desc:0 "The Republican belief in isolationism saved countless American lives by helping avert intervention in the European Great War. It shall continue with a defensive policy of naval buildup that keeps foreign empires out of American affairs and vice-versa."
 WCC_american_laisze_faire:0 "Laissez Faire Economics"
 WCC_american_laisze_faire_desc:0 "Too much government intervention will only harm rebuilding. We need to ensure that we are not overly interfering in our economy as it struggles to rebuild from the Civil War."
 WCC_soften_regulations:0 "Soften Regulations"
 WCC_soften_regulations_desc:0 "The last thing we need in the aftermath of this Civil War is unnecessary, burdensome regulations on businesses. We should cut back red tape and ensure that companies are able to succeed in these trying times."
 WCC_protect_industry:0 "Protect Industry"
 WCC_protect_industry_desc:0 "While not opposed to all trade it has long been the position of the Republican Party to protect our infant industries from foreign competition while they already engage in domestic competition so that we may develop more quickly."
 WCC_small_business_support:0 "Support Small Business"
 WCC_small_business_support_desc:0 "Small businesses were the backbone of the American economy, until many were destroyed in the Civil War. We should look into tax incentives and other strategies to restore small business confidence."
 WCC_give_me_your_poor:0 "Give Me Your Poor"
 WCC_give_me_your_poor_desc:0 "One of the founding traditions of America was that we took in the poor of the world and allowed them to flourish in our country. We must continue this tradition. Let us encourage poor, hardworking families from all over the world to immigrate to the United States, so that they may prosper under liberty and democracy."
 WCC_good_neighbor_policy:0 "Good Neighbor Policy"
 WCC_good_neighbor_policy_desc:0 "For decades, the United States has used force to maintain order in Latin America. However, given our recent Civil War, it is more difficult than ever for us to do that. Instead, we should endeavor to increase our cooperation and trade with our Southern neighbors for the mutual benefit of all involved."
 WCC_reduce_subsidies:0 "Reduce Subsidies"
 WCC_reduce_subsidies_desc:0 "Subsidies are an example of government overreach. It is difficult to know how much is enough in a subsidy, or if it will benefit either party at all. More often than not, it is merely wasted money. We should reduce government subsidies as much as possible and let the invisible hand of the market guide our business world."
 WCC_new_liberalism:0 "New Liberal Era"
 WCC_new_liberalism_desc:0 "Since the Republican party was elected to power American business and finance have risen to new heights. Unemployment is low, and stock prices continue to rise. God bless America and God bless capitalism!"
 WCC_education_campaign:0 "Education Campaign"
 WCC_education_campaign_desc:0 "Farm children are often kept out of school, with the excuse that they are needed as hands on the farm. This will no longer be the case. We will invest in rural schools as well as other methods of rural education so that every child in our country can receive the education they deserve."
 WCC_tolerance_campaign:0 "Tolerance Campaign"
 WCC_tolerance_campaign_desc:0 "What someone drinks or consumes in their time is not the business of the government. So long as it does not interfere with their work life, we should encourage tolerance of such practices. We make far too much income from such products to throw them away just for some of our more moralistic supporters."
#进步党
 WCC_social_democrats_in_power:0 "Progressives Elected"
 WCC_social_democrats_in_power_desc:0 "In an upset, the Progressive party has won the [GetYear] election! They have a sweeping agenda that emphasizes mending the divide between the working class and the wealthy, as well as building a welfare state."
 WCC_country_life_movement:0 "Country Life Movement"
 WCC_country_life_movement_desc:0 "The Country Life movement emphasizes a return to a rural lifestyle, and has grown popular among those disillusioned with city life following the turmoil of the Civil War. We should encourage it, as it helps improve the infrastructure and industry of neglected, rural areas."
 WCC_encourage_temperance:0 "Encourage Temperance"
 WCC_encourage_temperance_desc:0 "Overconsumption of liquor is little more than a gateway to poverty, madness, and sloth, and it remains one of the great social ills of our times. While the anti-Saloon League failed to nationally prohibit it, we can expand funding for dry county enforcement, build temperance fountains and scare the public straight with a campaign against liquor."
 WCC_citizen_education:0 "Citizen Education"
 WCC_citizen_education_desc:0 "All across the nation, Native American citizens are not receiving a proper, hands on education. Our Education system should implement some of John Dewey's reforms alongside a nationalistic program that promotes American values and loyalty."
 WCC_removing_money_from_politics:0 "Fight Money in Politics"
 WCC_removing_money_from_politics_desc:0 "Money is a cancer that has infected our political system for decades. For too long, politicians have been at the whim of their donors in the oil and steel industries, while simultaneously ignoring their loyal supporters. This will no longer be the case. Legislation banning all forms of dark money in politics will be passed while the amount of legal money that should be allowed in donations is still being debated."
 WCC_workers_compensation:0 "Worker's Compensation"
 WCC_workers_compensation_desc:0 "Workers must be protected from exploitation. Those who are injured in the workplace will be provided for by this new round of legislation, which allows wage replacement for such workers. Our disabled brethren deserve dignity too."
 WCC_new_anti_trust_laws:0 "New Anti-Trust Laws"
 WCC_new_anti_trust_laws_desc:0 "Corporate exploitation of the working class was a major reason for the rise of the CSA. We need to break up the largest banks and other industrial conglomerates to prevent this from occurring again."
 WCC_wealth_taxation:0 "Wealth Taxation"
 WCC_wealth_taxation_desc:0 "We cannot allow America to become a new aristocracy that eliminates divine right of monarchy but replaces it with wealth. Our new inheritance and land taxes will ensure that the wealthy do their patriotic duty and pay the appropriate amount of taxes to fund goods for the American people, especially its farmers and workers."
 WCC_new_public_works:0 "Public Works"
 WCC_new_public_works_desc:0 "We need to knock out two for the price of one and combat both the unemployment and under-development that poses a national security risk. The Public Works Administration will hire a large swath of people to build massive public projects such as dams, bridges, and highways. It may be expensive, but the hope it offers America is  WCC_resettlement_adminstration:0 "Resettlement Administration"
 WCC_resettlement_adminstration_desc:0 "Massive numbers of refugees fled all over the country during the Civil War. From African-Americans fleeing racist mobs in the South, to the wealthy fleeing to Canada and California, we must ensure that these refugees are settled back in their homes, or at least somewhere safe."
 WCC_farm_credit_act:0 "Farm Bankruptcy Act"
 WCC_farm_credit_act_desc:0 "The madness of allowing our farms to close, especially in a time of depression, is utterly intolerable! A co-operative Farm Credit System will be created to provide farmers cheap loans and to prevent the avoidable foreclosure of the nations providers, for their welfare and our own."
 WCC_national_railroads:0 "National Railroads"
 WCC_national_railroads_desc:0 "Our country is sadly lacking in providing a public means of national production while the Railroad Brotherhood desires greater protection from their bosses. The solution to this comes naturally via the nationalisation of railroads, purchased with money raised by bonds via the genius of Glenn E. Plumb."
 WCC_credit_unions:0 "Support Credit Unions"
 WCC_credit_unions_desc:0 "It is time to shake off the influence banks have over the lives of workers, farmers and the free-laborer. Credit unions will be issued cheap federal loans to get their start and tax breaks so that the independent contractors may be more self-reliant and the bankers held accountable."
 WCC_support_long:0 "Rescue the Kingfish"
 WCC_support_long_desc:0 "Is Huey Long a man without issue? Of course not; he runs a political machine and has a head the size of Mount Rushmore. However, he is an ally of the progressives in his region and his territory is a stalwart against the authoritarians while his economic policies promise to help break radicalism. We shall do for him what he is attempting to do for America and save him from the loons and cowards whom surround him."
 WCC_new_nationalism:0 "New Nationalism"
 WCC_new_nationalism_desc:0 "This New Nationalism regards the executive power as the steward of the public welfare. It demands of the judiciary that it shall be interested primarily in human welfare rather than in property, just as it demands that the representative body shall represent all the people rather than any one class or section of the people."
 WCC_food_stamps:0 "Food Stamps"
 WCC_food_stamps_desc:0 "Henry Wallace had a revelation when he saw surpluses of agricultural goods on one hill and starving citizens on another. If the market won't achieve equilibrium on its own, we will give it the encouragement it needs with a food stamp program that will make it easier for poor citizens to afford farm goods."
 WCC_quota_act:0 "Quota Act"
 WCC_quota_act_desc:0 "With all the pressure already laid on American culture and worker wages the last thing we need is large amounts of untrained, cheap laborers pouring over the border. The quota system will put a limit on the number of low-wage immigrants that can come into the nation annually."
 WCC_fair_labor_standards:0 "Fair Labor Standards"
 WCC_fair_labor_standards_desc:0 "The FLSA will go a long way to protect American workers. We plan to establish a minimum wage, give overtime pay, and implement harsher youth employment standards. These measures will go a long way in curbing corporate mistreatment of workers while also bolstering the economy."
 WCC_national_housing:0 "National Housing Act"
 WCC_national_housing_desc:0 "With many communities destroyed in the Civil War, we need to rebuild houses and resettle people from the massive refugee camps that have sprouted up all over the country."
 WCC_rural_electrification_administration:0 "Rural Electrification Administration"
 WCC_rural_electrification_administration_desc:0 "Many rural communities lack any sort of electrical power. By creating the Rural Electrification Administration, we can fund electrification efforts in these communities, boosting our party popularity and improving the economy significantly."
 WCC_social_security:0 "Social Security"
 WCC_social_security_desc:0 "A modern Social Security system will give the elderly the ability to retire in peace and financial security, and generate a great deal of popular support for our administration."

 #联邦党
 WCC_national_health_insurance:0 "National Health Insurance"
 WCC_national_health_insurance_desc:0 "When our citizens fall ill they are expected to pay for the right to live. This is immoral but worse, it drives the people in the arms of the faux-caring Marxists. A public healthcare option will provide universal health care, funded by an increase in the income tax, so that all may enjoy their natural right to life."
 WCC_protect_strikers:0 "Protect Strikers"
 WCC_protect_strikers_desc:0 "Strikers are little more than workers asserting their rights in the face of abysmal working conditions and yet governors, bosses, and judges believe they have the right to make Marxists look vindicated by cracking down on these patriotic Americans. Striking will be recognized as a national right and the army will protect those whom are attacked by industrial goons."
 WCC_fair_house_trade:0 "Fair House Standard Trade"
 WCC_fair_house_trade_desc:0 "While trade has its place, especially for our farmers whom must export their goods, our workers can not be expected to compete with every nation on earth. It also undermines our cause to accept cheap goods from nations that do not accept similar working conditions. Goods that will lower the wages of our workers will pay a higher tariff."
 WCC_national_electricity:0 "National Electricity"
 WCC_national_electricity_desc:0 "The American People need affordable electricity and they need it now. The government will take control of waterpower directly through buyouts and purchase majority shares in US electricity companies to organize cheap electricity for the public good to power America's railroads, streets and homes."
 WCC_commonwealth_victory:0 "Commonwealth Victory"
 WCC_commonwealth_victory_desc:0 "Sinclair has more than redeemed his 1934 loss of the Epic Plan, successfully distancing himself from the CSA as a promoter of egalitarianism and liberty that will ensure no form of Marxism gains a foothold in our Republic while giving the people what they need."
 WCC_radical_taxation:0 "Radical Taxation"
 WCC_radical_taxation_desc:0 "Neither the Liberals nor the Progressives go far enough in their tax plans which do little to promote true egalitarianism. The sales tax shall be replaced with the stock tax while income, land, inheritance, corporate, bank and property taxes shall be raised for the wealthy while the poorest are made exempt"
 WCC_commodity_credit_corporation: "Commodity Credit Corporation"
 WCC_commodity_credit_corporation_desc:0 "While a depression eats away at our nation, farmers have been hit worse than almost anyone. Our farmers cry out for help, and we shall answer them. We will create the Commodity Credit Corporation, which will protect farmers in their income and prices, as well as providing more stability for them. This fundamental group will no longer be ignored."
 WCC_fcwa:0 "Federal Civil Works Administration"
 WCC_fcwa_desc:0 "Millions of unemployed workers still roam the streets of America. We can fix this by giving these people a simple offer: work in construction to build up our infrastructure and we will make sure you earn a decent wage while doing it. This will significantly decrease unemployment as well as increasing the prosperity of the country as a whole. The newly-created F.C.W.A. will see to this task."
 WCC_federal_authority_for_land: "Federal Authority for Land"
 WCC_federal_authority_for_land_desc: "With this act, we will create a Bureau of Land Management. We will retain significant amounts of the country's land for our own purposes, and we will use it to build projects that will benefit our population and our environment. This is sure to be unpopular with those who wished to move into these lands, however..." 
 WCC_labor_colonies:0 "Labor Colonies"
 WCC_labor_colonies_desc:0 "From Robert Owen to Charles Fourier, utopian societies and colonies are nothing new in America. Now, we will promote the creation of "labor colonies", in which all workers can toil equally and live a healthy and happy life. Some advocates have even suggested we implement some of the non-authoritarian practices seen in Edward Bellamy's "Looking Backward"." 
 WCC_nationalize_oil:0 "Nationalize Oil"
 WCC_nationalize_oil_desc:0 "Oil barons like John D. Rockefeller have ravaged this country for decades. He is perhaps the richest man in history while millions of Americans starve. No longer will this be the case. We will put Oil into the government's hands so that neither capitalist vultures nor foreign opportunists can steal from us."
 WCC_nationalize_communication:0 "Nationalize Communication"
 WCC_nationalize_communication_desc:0 "We must go even further than Oil in our nationalization efforts. The telephone, radio, telegraph, and more have all been in private hands for too long. These things should belong to all of the American people, not just the wealthy, and we will strive to make sure this is the case."
 WCC_pensions:0 "Government Pensions"
 WCC_pensions_desc:0 "We will ensure that our elderly loved ones can retire with dignity. No longer will parents be a burden on their children. Instead, we will implement a system in which workers can pay into a fund that they will be able to draw from after retirement. Our elderly will live the rest of their lives in decency, no longer ashamed of their age."
 WCC_the_jungle:0 "The Jungle"
 WCC_the_jungle_desc:0 "The conditions workers must endure in the cities is simply unacceptable. Our public works projects will update infrastructure and factories to be in-line with what they truly need, not what the capitalist class merely wants."
 WCC_aim_for_the_heart:0 "Aim for the Heart"
 WCC_aim_for_the_heart_desc:0 "Though the public did not react as intended to Sinclair's book "The Jungle", his party can now push for the increased workers rights that he was really advocating for in that book. The hearts of all Americans will drop at the sight of mistreated workers, and an outcry will come, demanding better conditions. "
 WCC_hit_the_stomach:0 "Hit the Stomach"
 WCC_hit_the_stomach_desc:0 "While somewhat bitter about the reaction to "The Jungle", Sinclair has realized that his readers did have a point. We must make sure that the food we feed our families is not contaminated and poisoned by corporate greed or any physical substance for that matter. Legislation will be passed to ensure clean, fresh food for all Americans."
 WCC_bread_and_peace:0 "Bread and Peace"
 WCC_bread_and_peace_desc:0 "Though Sinclair and his party have distanced themselves from the CSA, perhaps an agreement would be possible. After all, we have many goals in common, and though we may resume conflict at a later date, we should focus our efforts on eradicating reactionaries. It would also be a popular decision with our more left-wing supporters. It's worth a shot..."
 WCC_communal_education:0 "Socialize Education"
 WCC_communal_education_desc:0 "There are many new ideas that our party has about education. Some advocate for a sort of "communal education", in which children can be raised and educated by their neighbors in addition to their parents. Others call for the promotion of socialist values in our schools, in order to instill socialism in the next generation. Both of these ideas are now being considered, and will come before Congress."
 WCC_union_expansion:0 "Union Expansion"
 WCC_union_expansion_desc:0 "There is only one surefire way to protect the rights of the working man and that's through unionization! Unions do not desire violence but won't be afraid to strike when necessary and demand what's theirs. We will work with like-minded union officials to aid their recruitment and protect them from crackdowns."
 WCC_social_commonwealth:0 "Commonwealth of Labor"
 WCC_social_commonwealth_desc:0 "With the foundation in place, we may finally become a Commonwealth of Labor by incorporating the unemployed into our programs and promoting private coops that do the same. Soon, all of the needy will be able to produce and trade with one another for what they need. Private companies will have to learn to either compete or purchase their goods at new government-set prices."
 WCC_the_profits_of_religion:0 "The Profits of Religion"
 WCC_the_profits_of_religion_desc:0 "While people having private religion is all good and well, many in our movement can not stand the so-called "Megachurches" or those who have made God's House into a marketplace. Churches above a certain size, including the so-called "New Thought" movement often seen in the freakish Spiritualist Party, will pay a small tax."
 WCC_support_the_aclu:0 "Support the ACLU"
 WCC_support_the_aclu_desc:0 "For too long, the state has been content with violating the civil rights of fellow citizens. No longer! We shall support the American Civil Liberties Union via a tax break, prosecuting violent harassment against them and waging a public campaign on their behalf while agreeing to remain politically neutral in their affairs so they can fight for the rights of all Americans."
 WCC_birth_control:0 "The Pivot of Civilization"
 WCC_birth_control_desc:0 "While there will be reactionaries who will denounce us, we must nonetheless go on to support the right of women to their own reproductive rights both for the individual and social good. Laws against birth control will be struck down and access to their availability in poorer neighborhoods made easier. In the long term this will aid in encouraging less productive citizens to have fewer children."
 WCC_experimental_sciences:0 "Experimental Sciences"
 WCC_experimental_sciences_desc:0 "If we are to be truly progressive, we must put our faith in scientific progress! There are a great deal of proposals looking for funding, and while there will surely be failures along the way, these are nothing compared to the breakthroughs that will result from increased funding to scientific endeavors, even ones that would usually be scoffed at."
 WCC_prohibition:0 "Prohibition"
 WCC_prohibition_desc:0 "There are few things damaging the working class as much as unfettered capitalism but alcohol may be a close contender. The drink is used by the ruling classes to control their workers, and it destroys their bodies and morals alongside their families. It's time to finally complete the goals of the Anti-Saloon Leagues and illegalize liquor."
#民主党
 WCC_social_conservatives_in_power:0 "Democrats Elected"
 WCC_social_conservatives_in_power_desc:0 "The Democratic Party have won the [GetYear] elections. Despite losing some of their more radical members to the ODP and AFP, they are still a very socially conservative party, although they are more fiscally moderate."
 WCC_support_business:0 "Support Businesses"
 WCC_support_business_desc:0 "While the unchecked capitalist excesses of the Republican party are a step too far, we still must ensure that businesses have the proper support from the government. Anti-syndicalist regulations are a key step on this path."
 WCC_business_grants:0 "Business Grants"
 WCC_business_grants_desc:0 "Larger business also suffered in the Civil War, and just like smaller businesses need government intervention to be fully restored to their pre-war profitability."
 WCC_public_schooling:0 "Public Schooling Support"
 WCC_public_schooling_desc:0 "Public schools must be adequately funded, and more importantly, they must have the correct curriculum. Teaching our children the importance of freedom, democracy, and liberty - as well as the evils of radicalism and syndicalism - is key to the future of our country."
 WCC_red_scare:0 "Red Scare"
 WCC_red_scare_desc:0 "Syndicalism has destroyed what was once the most industrially productive part of our country. We need to ensure it will never take root in the last bastion of freedom."
 WCC_anti_unionism:0 "Anti-Syndicalism Act"
 WCC_anti_unionism_desc:0 "One of the first pieces of legislation we must pass is the new Anti-Syndicalism Act, which will prevent anyone who ever registered as a member of the SPA from holding public office. Those who previously professed syndicalist leanings will be revealed to the world as the traitors to freedom they are."
 WW_social_hygiene:0 "Social Hygiene"
 WCC_social_hygiene_desc:0 "The government shall support a public health campaign to protect against various illnesses. As part of this campaign we shall work to regulate vice and sin that are the source of so many ills be their physical, moral, or spiritual."
 WCC_america_business_is_business:0 "America's Business is Business"
 WCC_america_business_is_business_desc:0 "American industry was the backbone of our country. While the ravages of the Civil War have destroyed much of our once-prosperous commercial sector, with the proper amount of government action it can be brought back into prominence."
 WCC_national_immigration_act:0 "Immigration Act Reformed"
 WCC_national_immigration_act_desc:0 "We must ease restrictions on immigrants coming into our country. Prominent liberals in our government have suggested we rescind the prohibition on Asian immigrants and allow some workers from across the border to remain in the country with their families. This will improve relations with these countries and give us more manpower."
 WCC_states_autonomy:0 "Strengthen State Autonomy"
 WCC_states_autonomy_desc:0 "The federal government can not be expected to administrate everything. Indeed the lack of states rights in favor of an inept central government was central to the collapse of the United States. Relief programs, taxation and other administrative duties will be further devolved to the states."
 WCC_patriotic_shorts:0 "Patriotic Shorts"
 WCC_patriotic_shorts_desc:0 "With the population notably short on both entertainment and patriotism in these trying times we should use the recent growth of cinema to promote patriotism. We shall hire animators, particularly the Disney corporation, to come up with patriotic short films and clips directed especially at families to reassure them of what we are fighting for."
 WCC_welfare_reform:0 "Tighten Welfare Requirements"
 WCC_welfare_reform_desc:0 "Local and state welfare had been expanding since the late 20th century but their resources are famously short as of now. We should coordinate with local governments and businesses to make local forms of welfare such as food and cash relief more exclusive to widowed mothers and tighten local workers compensation to focus on the truly disabled."
 WCC_levering_act:0 "Levering Act"
 WCC_levering_act_desc:0 "California representative Harold K. Levering has, with assistance from representative Jack Tenney, written a new oath for all state employees (including teachers) to take in which they disavow radicalism, particularly syndicalism. Those who violate or refuse to take the oath can be removed from government positions where they may have caused considerable damage."
 WCC_increase_defense_spending:0 "Increase Defense Spending"
 WCC_increase_defense_spending_desc:0 "After the recent Civil War, it is clear that we must support the military, should a similar event take place someday. We must also guard our weakened country from opportunistic vultures. In the pursuit of these goals, let us invest in Radar technology, as well as updated forms of artillery for our military."
 WCC_social_gospel:0 "Social Gospel"
 WCC_social_gospel_desc:0 "It is a simple fact of economics that wealth trickles down from the wealthiest to the less fortunate. We should ensure that our citizens are aware of this new social gospel."
 WCC_labor_management:0 "Labor-Management Act"
 WCC_labor_management_desc:0 "Poor labor relations was a key spark behind the Civil War. We should ensure that unions and other syndicalist groups have their power stripped away, and that business owners truly have their employees’ interests in mind."
 WCC_fiscal_reform:0 "Fiscal Reform"
 WCC_fiscal_reform_desc:0 "We need a comprehensive reform of our finance and banking system. Cutting back red tape, unnecessary regulations, and other roadblocks to success are what this country needs after the Civil War."
 WCC_bureau_of_the_budget:0 "Bureau of the Budget"
 WCC_bureau_of_the_budget_desc:0 "A balanced budget is key in running any state. None of this 'deficit spending' nonsense. We should only spend what we make, and not a cent more."
 WCC_hays_code:0 "Hay's Code"
 WCC_hays_code_desc:0 "While everyone enjoys a good film now and then, the unchecked moral excesses of Hollywood need to be clamped down on. A strict code of conduct for actors and producers is required to avoid the spread of syndicalist messaging in films."
 WCC_moral_education:0 "Moral Education"
 WCC_moral_education_desc:0 "Higher education has long been a bastion of the elite, and it should be kept that way. The prestigious halls of the Ivy Leagues are no place for those not prepared. They should be reserved for the future leaders of America, so they can receive the best education possible."
 WCC_new_american_century:0 "New American Century"
 WCC_new_american_century_desc:0 "In the time since our election, we have created a foundation to restore America to greatness. Rebuilding from the Civil War will take time, but we now out to the world, ready for a new century of greatness."
 WCC_family_law:0 "Family Law"
 WCC_family_law_desc:0 "The strong society requires a strong society but sadly too many socially irresponsible citizens ignore this. The Family Law Act requires each state to enforce child support, requiring fathers with an income to contribute to their family even in the case of a divorce, and likewise requires wealthy sons to provide for their elder parents if they fall into poverty."
 WCC_expand_national_guard:0 "Expand the National Guard"
 WCC_expand_national_guard_desc:0 "A strong military is more important than ever if we are to survive in our present situation. We should rely on the older and more established National Guard to defend us, sending them our recently acquired business-friendly funds and giving them permission to initiate a new round of drafts."
 WCC_entente_support:0 "Entente Support"
 WCC_entente_support_desc:0 "There are few entities left that are loyal to both tradition and democracy but one of them is the anti-Syndicalist Entente. The Democratic Party's business, liberal and Catholic wings have desired closer to ties with them, understanding that their and our struggle is one and the same. We must request support in these trying times."
 WCC_self_regulation:0 "Self Regulation"
 WCC_self_regulation_desc:0 "New trade groups are seeking to court our favor by showing interest in upholding social values via industrial self-regulation, in which their respective industries ensure minimal quality of life for workers and respect for patriotism, starting with a new attempt by universities to stomp out radical thought. We should promote any such industries who follow this model and provide them with small tax breaks."
 WCC_stop_desecration:0 "Protect American Symbols"
 WCC_stop_desecration_desc:0 "The radicals would destroy every symbol of Americanism due to their maddening totality of belief in class conflict. Enough! The government shall promote the heavier use of patriotic symbols via contact with industrial trade groups, use more American symbols on government property and ban flag desecration under penalty of a small fine."
 wcc.999.t:0 "Reinstatement of elections"
 wcc.999.d:0 "As the political situation in the country stabilized, General Omar Bradley realized that it was time for military rule to come to an end. At a recent press conference, General Bradley announced that elections would be held within a month, and the major political parties have caught wind of this and are rushing to prepare for a new election and select their presidential candidates."
 wcc.999.a:0 "It's time"
 wcc.1000.t:0 "Commonwealth Nomination"
 wcc.1000.d:0 "The Commonwealth Party, sometimes informally nicknamed the Left Democrats due to their activism on the left-labor wing of the Democratic Party, has convened today for its first Nomination. Inspired by Sinclair's former EPIC (End Poverty in California) campaign, it is no wonder the radical activist is the leading candidate but has a surprisingly strong contender in California State Senator Culbert Olson. But which will win?"
 wcc.1000.a:0 "Upton Sinclair has it"
 wcc.1000.b:0 "Culbert Olson!"
 wcc.1001.t:0 "[GetYear] Progressive Party Convention"
 wcc.1001.d:0 "The [GetYear] Progressive Party Primary is here, with Iowa activist Henry Wallace, a prominent ally of the Farmers and Labor Party, taking the lead at a highly contentious convention; George Norris, a former Progressive Party candidate, is also popular. Who will get the Progressive Party's nomination?"
 wcc.1001.a:0 "Congratulations, Mr. Wallace!"
 wcc.1001.b:0 "George Norris" 
 wcc.1002.t:0 "[GetYear] Democratic-Republican Convention"
 wcc.1002.d:0 "The Democratic-Republican Party has two candidates for the nominee in [GetYear]：San Francisco District Attorney Earl Warren, while the other was progressive activist Philip La Follette. Both men have strong voices in the Democratic and Republican parties. Who will be nominated?"
 wcc.1002.a:0 "Earl Warren!"
 wcc.1002.b:0 "Philip La Follette!"
 wcc.1003.t:0 "[GetYear] Republican Convention"
 wcc.1003.d:0 "The [GetYear] Republican runoff came, the West Coast millionaire Howard Hughes and Thomas Dewey were vying for the presidential nomination. Who will eventually win the Republican presidential nomination?"
 wcc.1003.a:0 "Thomas Dewey"
 wcc.1003.b:0 "Howard Hughes"
 wcc.1004.t:0 "[GetYear] Democratic Convention"
 wcc.1004.d:0 "Two candidates were nominated by party bosses in [GetYear] : Lance "Cactus Jack" Garner, the Democratic candidate in the 1936 general election, and Alben W. Buckley. Who will eventually win the Democratic Party's presidential nomination?"
 wcc.1004.a:0 "Lance Garner"
 wcc.1004.b:0 "Alben W. Buckley"
 wcc.1005.t:0 "Rise of the National Democratic Party"
 wcc.1005.d:0 "In addition to the traditional big parties such as the Democratic Republic and the rising upstarts such as the Progressive Party, a sudden political dark horse, the National Democratic Party, led by newspaper magnate Randolph Hearst, sprang up with surprising momentum in the Pacific coast states and soon gained a large number of supporters across the country. Hearst, the party's sole candidate and the leader of the National Democratic Party, expressed a strong desire to run. Under his propaganda, the International Democratic Party is no less powerful than the rest of the electoral parties."
 wcc.1005.a:0 "What a weirdo"
 wcc.1006.t:0 "Election"
 wcc.1006.d:0 "The Election is finally upon us, with each party hoping to take its place in the Presidency. Thanks to the many parties running and the First-past the post system the party with the most votes will undoubtedly hold a disproportionate number of seats in Congress."
 wcc.1006.a:0 "A Commonwealth Party victory!"
 wcc.1006.b:0 "A Progressive Party victory!"
 wcc.1006.c:0 "A Democratic-Republican victory!"
 wcc.1006.e:0 "A Republican victory!"
 wcc.1006.f:0 "A Democratic victory!"
 wcc.1006.g:0 "National Democratic Party win!"
 autdem_progressive_conservatism_subtype:0 "Progressive Conservatism"
 autdem_progressive_conservatism_subtype_desc:0 "§Y(Progressive Conservatism)§!\n\nProgressive Conservatism is a political ideology that naturally combines conservative and progressive policies first birthed during the Age of Enlightenment in order to create an orderly and responsible society that still cares for its people. First appearing in Western Europe in conservative groups pushing for social reform in the areas of science, economics, education, technology, medicine, and other facets of human living conditions that had begun to be negatively affected by the Industrial Revolution and its growing consequences, as well as with the abolitionist movement that had begun to take flight around the time, particularly in Britain. Calling for social safety nets and minimalist welfare systems, Progressive Conservatism seeks to improve society without radical or rapid changes to the established status quo and traditions, and is often tied to Catholic social teaching, Christian democracy, and even the papal literary work ‘Rerum novarum’ which calls for a form of Catholic conservative progressivism in order to safeguard the Christian working masses against the predation of Socialism. In more modern times, the ideology has been practiced and adapted across the world by the likes of former American president Theodore Roosevelt and British prime minister Benjamin Disraeli, and now has begun finding contemporary popularity once again as a Conservative alternative to more dangerous and radical Leftist progressivist ideology."
 WCC_Henry_Lewis_Stimson_for_sli:0 "Henry L. Stimson"