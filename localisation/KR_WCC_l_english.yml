 USA_OMAR_BRADLEY_POLITICS_DESC:0 "Born in 1893 to an impoverished family, Omar Bradley grew up with a love for athletics and firearms. In fact, after a talented baseball career in high school, he was offered a spot in several professional teams, but he declined to pursue a future in the military. Bradley became a military instructor and eventually became acquainted with George Marshall, who described him as "quiet, unassuming, capable, with sound common sense". More recently, Bradley taught at West Point, then studied at the U.S. Army War College. Bradley has undergone a meteoric rise in rank in the various recent American crises; a shortage in the American military leadership means that he is one of the first men called upon to lead. His boss, George Marshall, once said that you could give Bradley a job and forget about it. Now though, he must perform the job of a lifetime: saving America from itself. Douglas MacArthur has assumed control of the country, and partly due to the animosity between the two men, partly due to his high rank, Bradley has been sent to lead Federal forces in the West. He will be assisted in this task by Dwight Eisenhower, a man who Bradley trusts and respects far more than MacArthur. This 'Western Command Center' will theoretically exist only so long as rebels exist; once they have are defeated, it will be reincorporated into the United States. However, if Douglas MacArthur fails to fulfill his promise of stepping down once the crisis is over, desperate measures may need to be taken to ensure the contiuation of democracy in America..."
 POLITICS_DWIGHT_EISENHOWER_DESC:0 "Born in 1890 to a family tracing its presence in America to the eighteenth-century, Dwight D. Eisenhower had an eventful childhood. He had many interests, but chief among them was a love for military history, inspired by his mother's history book collection. Eisenhower was eventually accepted into West Point, where he tried his hand at a variety of sports, though none would hold his love more than playing cards. Eisenhower met Omar Bradley, a man with whom he would develop a close friendship, at West Point, and the two have both progressed in the military since. Eisenhower's organizational abilities first shined in this period of his life, but they only became more apparent to all observers once he began to command men and units. He held the rank of major for sixteen years but continued gaining prestige and influence within the military, working with men such as George S. Patton, John J. Pershing, Fox Conner, Douglas MacArthur, and George Marshall. As for MacArthur, it seems that destiny, fate, or whatever else one decides to believe in has put these two men together. Eisenhower has served as one of MacArthur's top men, and though the two have had vehement disagreements, Eisenhower has downplayed that part of their relationship, noting that they have always had a good relationship. However, as the two fought over MacArthur's reaction to the servicemen protests in 1932, so too have they fought over MacArthur's increasing involvement over politics. Eisenhower had publicly supported the Federal and MacArthurite lines, but they had argued behind the scenes. During the war, Ike was given joint control over Federal lands in the West with Omar Bradley as a general, a position he held even as enemies surrounded his men on all sides. Eisenhower worried that MacArthur would not relinquish his power once the Civil War was over, and it appears his fears were well founded. Despite this, Omar Bradley and Dwight Eisenhower have restored democracy to America, though neither man fully trusts the government, and have kept some of their power in a bid to prevent future crises from emerging. Eisenhower is a war hero, and the American people love him; adults write adoring letters to him, and those who know him best challenge him to a game of bridge every so often. Children sing "I like Ike" on playgrounds and even the elderly have good things to say about him. For Eisenhower though, his work has only just begun."

